    font-size: 11px;
    font-weight: 800;

    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    position: relative;
  }
  .apt-pin::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 6px 5px 0;
    border-style: solid;
    border-color: #059669 transparent transparent transparent;
    display: block;
    width: 0;
    height: 0;

    color: #ffffff;
    transform: scale(1.08);

  }
  .apt-pin:hover::after, .apt-pin.active::after {
    border-color: #059669 transparent transparent transparent;
  }
  .apt-pin .dot {
    width: 7px;
    height: 7px;
    background: #10b981;
    border-radius: 50%;
  }
  .apt-pin.active .dot {
    background: #ffffff;

    cursor: default;
    z-index: 1000;
  }

    100% { transform: scale(1) translateY(0); opacity: 1; }

    position: absolute;

    left: 50%;
    transform: translateX(-50%);

    let activeApt = null;
    let activeBubbleOverlay = null;
    let currentDongAptList = [];
    let currentDongCenterLat = 35.21305;
    let currentDongCenterLng = 126.88373;

    function initMap() {
      const container = document.getElementById('mapContainer');
      const lat = currentDongCenterLat;
      const lng = currentDongCenterLng;

      if (window.kakao && window.kakao.maps) {
        mapMode = "kakao";
        const options = { center: new kakao.maps.LatLng(lat, lng), level: 4 };
        kakaoMapInstance = new kakao.maps.Map(container, options);
        kakao.maps.event.addListener(kakaoMapInstance, 'click', function() {
          closeAllBubbles();
        });
        loadDongData("본촌동");
      } else {
        mapMode = "leaflet";
        leafletMapInstance = L.map('mapContainer', { zoomControl: false }).setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(leafletMapInstance);
        leafletMapInstance.on('click', function() {
          closeAllBubbles();
        });
        loadDongData("본촌동");
      }
    }

    function initRegionSelectors() {
      const sidoSel = document.getElementById('sidoSelect');
      sidoSel.innerHTML = '<option value="광주광역시" selected>광주광역시</option>';
      const sigunguSel = document.getElementById('sigunguSelect');
      sigunguSel.innerHTML = '<option value="북구" selected>북구</option>';
      updateDongOptions("광주광역시", "북구");
    }

    function updateDongOptions(sido, sigungu) {
      const dongSel = document.getElementById('dongSelect');
      dongSel.innerHTML = '';
      const dongs = (REGION_DATA[sido] && REGION_DATA[sido][sigungu]) || ["본촌동", "양산동"];
      dongs.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        if (d === "본촌동") opt.selected = true;
        dongSel.appendChild(opt);
      });
    }

    function onDongChange() {
      const dong = document.getElementById('dongSelect').value;
      loadDongData(dong);
    }

    function quickSelectDong(dong) {
      document.getElementById('dongSelect').value = dong;
      loadDongData(dong);
    }

    function loadDongData(dongName) {
      document.getElementById('currentAddressLabel').textContent = "광주 북구 " + dongName;
      let apts = APT_DATABASE[dongName];
      if (!apts || apts.length === 0) {
        apts = APT_DATABASE["본촌동"];
      }
      currentDongAptList = apts;
      document.getElementById('dongComplexCountBadge').textContent = apts.length + "개 단지 연동";

      if (apts.length > 0) {
        currentDongCenterLat = apts[0].lat;
        currentDongCenterLng = apts[0].lng;
        if (mapMode === "kakao" && kakaoMapInstance) {
          kakaoMapInstance.setCenter(new kakao.maps.LatLng(currentDongCenterLat, currentDongCenterLng));
        } else if (leafletMapInstance) {
          leafletMapInstance.setView([currentDongCenterLat, currentDongCenterLng], 16);
        }
      }

      drawMarkers(apts);
    }

    function drawMarkers(apts) {
      clearMarkers();
      if (mapMode === "kakao" && kakaoMapInstance) {
        drawKakaoMarkers(apts);
      } else if (leafletMapInstance) {
        drawLeafletMarkers(apts);
      }
    }

    function clearMarkers() {
      closeAllBubbles();
      if (mapMode === "kakao") {
        currentMarkers.forEach(m => m.setMap(null));
      } else if (leafletMapInstance) {
        currentMarkers.forEach(m => leafletMapInstance.removeLayer(m));
      }
      currentMarkers = [];
    }

    function drawKakaoMarkers(apts) {
      apts.forEach(apt => {
        const pos = new kakao.maps.LatLng(apt.lat, apt.lng);
        const types = apt.types || [];
        const mainType = types[0] || { pyeong: "34평형", sale: "3억 1,000만" };
        const countTxt = types.length > 1 ? '<span style="font-size:9px;color:#047857;margin-left:2px;">(' + types.length + '개평형)</span>' : '';

        const content = document.createElement('div');
        content.className = 'apt-pin';
        content.innerHTML = '<span class="dot"></span><span>' + apt.name + '</span><span class="price-tag">' + mainType.sale + '</span>' + countTxt;

        content.onclick = function(e) {
          e.stopPropagation();
          onComplexTouch(apt, pos, content);
        };

        const overlay = new kakao.maps.CustomOverlay({
          position: pos,
          content: content,
          yAnchor: 1.15,
          zIndex: 10
        });
        overlay.setMap(kakaoMapInstance);
        currentMarkers.push(overlay);
      });
    }

    function drawLeafletMarkers(apts) {
      apts.forEach(apt => {
        const types = apt.types || [];
        const mainType = types[0] || { pyeong: "34평형", sale: "3억 1,000만" };
        const countTxt = types.length > 1 ? '<span style="font-size:9px;color:#047857;margin-left:2px;">(' + types.length + '개평형)</span>' : '';

        const icon = L.divIcon({
          className: 'apt-pin-leaflet',
          html: '<div class="apt-pin"><span class="dot"></span><span>' + apt.name + '</span><span class="price-tag">' + mainType.sale + '</span>' + countTxt + '</div>',
          iconSize: [140, 32],
          iconAnchor: [70, 36]
        });

        const marker = L.marker([apt.lat, apt.lng], { icon: icon }).addTo(leafletMapInstance);
        marker.on('click', function(e) {
          L.DomEvent.stopPropagation(e);
          onComplexTouch(apt, [apt.lat, apt.lng], null);
        });
        currentMarkers.push(marker);
      });
    }

    function onComplexTouch(apt, pos, element) {
      activeApt = apt;
      closeAllBubbles();

      if (element) {
        document.querySelectorAll('.apt-pin').forEach(p => p.classList.remove('active'));
        element.classList.add('active');
      }

      const types = apt.types || [];
      let rowsHtml = '';
      types.forEach((t, idx) => {
        rowsHtml += 
          '<div class="bubble-pyeong-item ' + (idx === 0 ? 'selected' : '') + '" onclick="window.selectPyeongInBubble(' + idx + ', event)">' +
            '<div>' +
              '<span class="bubble-pyeong-name"><span>🏢</span> ' + t.pyeong + '</span>' +
              '<span class="bubble-pyeong-sub">' + (t.spec || '') + '</span>' +
            '</div>' +
            '<div class="bubble-pyeong-price">' +
              '<div>매매 ' + t.sale + '</div>' +
              '<div class="bubble-pyeong-sub">전세 ' + t.jeonse + '</div>' +
            '</div>' +
          '</div>';
      });

      const bubbleEl = document.createElement('div');
      bubbleEl.className = 'touch-speech-bubble';
      bubbleEl.innerHTML = 
        '<div class="bubble-header">' +
          '<div class="bubble-title">' +
            '<span>📍</span> <span>' + apt.name + '</span>' +
            '<span class="bubble-count-badge">총 ' + types.length + '개 평형</span>' +
          '</div>' +
          '<button class="bubble-close-btn" onclick="window.closeAllBubbles()">✕</button>' +
        '</div>' +
        '<div class="bubble-pyeong-list">' + rowsHtml + '</div>';

      if (mapMode === "kakao" && kakaoMapInstance) {
        activeBubbleOverlay = new kakao.maps.CustomOverlay({
          position: pos,
          content: bubbleEl,
          yAnchor: 1.25,
          zIndex: 999
        });
        activeBubbleOverlay.setMap(kakaoMapInstance);
        kakaoMapInstance.panTo(pos);
      } else if (leafletMapInstance) {
        const popup = L.popup({ closeButton: false, offset: [0, -32], className: 'custom-bubble-popup' })
          .setLatLng(pos)
          .setContent(bubbleEl)
          .openOn(leafletMapInstance);
        activeBubbleOverlay = popup;
      }

      updateBottomSheet(apt, types[0]);
    }

    window.closeAllBubbles = function() {
      if (activeBubbleOverlay) {
        if (mapMode === "kakao") activeBubbleOverlay.setMap(null);
        else if (leafletMapInstance) leafletMapInstance.closePopup();
        activeBubbleOverlay = null;
      }
      closeSheet();
    };

    window.selectPyeongInBubble = function(typeIdx, e) {
      if (e) e.stopPropagation();
      if (!activeApt) return;
      const t = activeApt.types[typeIdx];
      if (t) {
        updateBottomSheet(activeApt, t);
        document.querySelectorAll('.bubble-pyeong-item').forEach((el, idx) => {
          if (idx === typeIdx) el.classList.add('selected');
          else el.classList.remove('selected');
        });
      }
    };

    function updateBottomSheet(apt, selectedType) {
      document.getElementById('sheetAptName').textContent = apt.name;
      document.getElementById('sheetDongAddress').innerHTML = '<span>📍</span> <span>' + apt.addr + '</span>';

      const types = apt.types || [selectedType];
      document.getElementById('sheetPyeongCountTag').textContent = '총 ' + types.length + '개 평형';

      const chipsContainer = document.getElementById('sheetPyeongChips');
      chipsContainer.innerHTML = '';

      types.forEach((t) => {
        const chipBtn = document.createElement('button');
        const isCur = t.pyeong === selectedType.pyeong;
        chipBtn.className = "shrink-0 px-3 py-1.5 rounded-xl text-xs font-black transition " +
          (isCur ? "bg-emerald-600 text-white shadow-sm ring-2 ring-emerald-300" : "bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200");
        chipBtn.textContent = t.pyeong;
        chipBtn.onclick = function() {
          updateBottomSheet(apt, t);
        };
        chipsContainer.appendChild(chipBtn);
      });

      document.getElementById('sheetPriceSale').textContent = selectedType.sale;
      document.getElementById('sheetPriceJeonse').textContent = selectedType.jeonse;
      document.getElementById('sheetPriceMonthly').textContent = selectedType.monthly;

      document.getElementById('bottomSheet').classList.remove('hidden-sheet');
    }

    function closeSheet() {
      document.getElementById('bottomSheet').classList.add('hidden-sheet');
      document.querySelectorAll('.apt-pin').forEach(p => p.classList.remove('active'));
    }

    function goToMain() {
      window.location.href = '/';
    }

    function goToMyLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          if (mapMode === "kakao" && kakaoMapInstance) {
            kakaoMapInstance.setCenter(new kakao.maps.LatLng(lat, lng));
            kakaoMapInstance.setLevel(4);
          } else if (leafletMapInstance) {
            leafletMapInstance.setView([lat, lng], 16);
          }
        }, function(err) {
          alert("위치 권한을 확인해주세요.");
        });
      }
    }

    window.addEventListener('load', () => {
      initRegionSelectors();
      initMap();
    });
  </script>
</body>
</html>
