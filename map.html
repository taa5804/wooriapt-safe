<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>우리아파트 지도</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
      background: #f3f4f6;
    }

    .price-marker {
      position: relative;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 110px;
      height: 40px;

      padding: 0 13px;

      background: #0b63ce;
      color: #ffffff;

      border-radius: 20px;

      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.25);

      cursor: pointer;
    }

    .price-marker::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: -8px;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #0b63ce;
    }

    .loading {
      position: fixed;

      top: 15px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      padding: 10px 16px;

      background: rgba(0, 0, 0, 0.78);
      color: #ffffff;

      border-radius: 20px;

      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div id="loading" class="loading">
    아파트 단지를 불러오는 중...
  </div>


  <!-- 카카오 지도 SDK -->
  <script
    type="text/javascript"
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=afb1495e5138ed5d431f6203b02a7a29&libraries=services"
  ></script>


  <script>

    /*
    ==================================================
    지도 기본 설정
    ==================================================
    */

    const map =
      new kakao.maps.Map(
        document.getElementById("map"),
        {
          center:
            new kakao.maps.LatLng(
              36.5,
              127.8
            ),

          level: 13
        }
      );


    /*
    ==================================================
    카카오 장소검색
    ==================================================
    */

    const places =
      new kakao.maps.services.Places();


    /*
    ==================================================
    표시된 풍선
    ==================================================
    */

    const overlays = [];


    /*
    ==================================================
    중복 단지 방지
    ==================================================
    */

    const apartmentKeys =
      new Set();


    /*
    ==================================================
    DB 값 읽기
    ==================================================
    */

    function getValue(
      item,
      names
    ) {

      for (
        const name of names
      ) {

        if (
          item &&
          item[name] !== undefined &&
          item[name] !== null &&
          String(item[name]).trim() !== ""
        ) {

          return String(
            item[name]
          ).trim();

        }

      }

      return "";
    }


    /*
    ==================================================
    시도
    ==================================================
    */

    function getRegion(item) {

      return getValue(
        item,
        [
          "시도",
          "region",
          "sido",
          "do"
        ]
      );

    }


    /*
    ==================================================
    시군구
    ==================================================
    */

    function getCity(item) {

      return getValue(
        item,
        [
          "시군구",
          "city",
          "sigungu"
        ]
      );

    }


    /*
    ==================================================
    읍면동
    ==================================================
    */

    function getDong(item) {

      return getValue(
        item,
        [
          "읍면동",
          "읍면",
          "동리",
          "dong",
          "emd",
          "legal_dong"
        ]
      );

    }


    /*
    ==================================================
    아파트 단지명
    ==================================================
    */

    function getApartmentName(item) {

      return getValue(
        item,
        [
          "단지명",
          "아파트명",
          "apt_name",
          "apartment_name",
          "apt",
          "apartment"
        ]
      );

    }


    /*
    ==================================================
    주소
    ==================================================
    */

    function getFullAddress(item) {

      return getValue(
        item,
        [
          "도로명주소",
          "도로명",
          "road_address",
          "roadAddress",
          "주소",
          "address",
          "full_address",
          "jibun_address",
          "지번주소"
        ]
      );

    }


    /*
    ==================================================
    검색어 만들기
    ==================================================
    */

    function makeSearchWords(item) {

      const region =
        getRegion(item);

      const city =
        getCity(item);

      const dong =
        getDong(item);

      const apartmentName =
        getApartmentName(item);

      const fullAddress =
        getFullAddress(item);


      const words = [];


      /*
      1순위
      전체주소 + 아파트명
      */

      if (
        fullAddress &&
        apartmentName
      ) {

        words.push(
          fullAddress +
          " " +
          apartmentName
        );

      }


      /*
      2순위
      시도 + 시군구 + 동 + 아파트명
      */

      if (
        apartmentName
      ) {

        words.push(
          [
            region,
            city,
            dong,
            apartmentName
          ]
          .filter(Boolean)
          .join(" ")
        );

      }


      /*
      3순위
      시군구 + 동 + 아파트명
      */

      if (
        apartmentName
      ) {

        words.push(
          [
            city,
            dong,
            apartmentName
          ]
          .filter(Boolean)
          .join(" ")
        );

      }


      /*
      4순위
      아파트명만
      */

      if (
        apartmentName
      ) {

        words.push(
          apartmentName
        );

      }


      /*
      중복 검색어 제거
      */

      return [
        ...new Set(
          words.filter(
            Boolean
          )
        )
      ];

    }


    /*
    ==================================================
    풍선 생성
    ==================================================
    */

    function createApartmentOverlay(
      item,
      position
    ) {

      const apartmentName =
        getApartmentName(item) ||
        "아파트";


      const content =
        document.createElement(
          "div"
        );


      content.className =
        "price-marker";


      content.innerText =
        "거래비용 50%↓";


      const overlay =
        new kakao.maps.CustomOverlay({

          position:
            position,

          content:
            content,

          yAnchor:
            1.35

        });


      overlay.setMap(
        map
      );


      overlays.push(
        overlay
      );


      /*
      풍선 클릭
      */

      content.addEventListener(
        "click",
        function () {

          alert(
            apartmentName +
            "\n\n" +
            "아파트 거래비용 50% 절약"
          );

        }
      );

    }


    /*
    ==================================================
    카카오 장소검색 1회
    ==================================================
    */

    function keywordSearch(
      keyword
    ) {

      return new Promise(
        function(resolve) {

          if (
            !keyword
          ) {

            resolve(null);
            return;

          }


          places.keywordSearch(
            keyword,

            function(
              result,
              status
            ) {

              if (
                status !==
                kakao.maps.services.Status.OK
              ) {

                resolve(null);
                return;

              }


              if (
                !result ||
                result.length === 0
              ) {

                resolve(null);
                return;

              }


              resolve(
                result
              );

            },

            {
              size: 15
            }

          );

        }
      );

    }


    /*
    ==================================================
    검색 결과에서 해당 아파트 선택
    ==================================================
    */

    function findApartmentResult(
      results,
      apartmentName
    ) {

      if (
        !results ||
        results.length === 0
      ) {

        return null;

      }


      const cleanName =
        String(
          apartmentName || ""
        )
        .replace(
          /\s+/g,
          ""
        )
        .toLowerCase();


      /*
      아파트명이 결과에 포함된 결과 우선
      */

      for (
        const result of results
      ) {

        const placeName =
          String(
            result.place_name || ""
          )
          .replace(
            /\s+/g,
            ""
          )
          .toLowerCase();


        if (
          cleanName &&
          placeName.includes(
            cleanName
          )
        ) {

          return result;

        }

      }


      /*
      정확히 못 찾으면
      첫 번째 결과 사용
      */

      return results[0];

    }


    /*
    ==================================================
    단지 1개 좌표 찾기
    ==================================================
    */

    async function findApartmentPosition(
      item
    ) {

      const apartmentName =
        getApartmentName(item);


      if (
        !apartmentName
      ) {

        return null;

      }


      const searchWords =
        makeSearchWords(item);


      /*
      검색어를 순서대로 시도
      */

      for (
        const keyword of searchWords
      ) {

        const results =
          await keywordSearch(
            keyword
          );


        const result =
          findApartmentResult(
            results,
            apartmentName
          );


        if (
          result &&
          result.y &&
          result.x
        ) {

          return {
            lat:
              Number(
                result.y
              ),

            lng:
              Number(
                result.x
              )
          };

        }

      }


      return null;

    }


    /*
    ==================================================
    아파트 1개 처리
    ==================================================
    */

    async function processApartment(
      item
    ) {

      const apartmentName =
        getApartmentName(item);


      if (
        !apartmentName
      ) {

        return false;

      }


      /*
      단지 중복 제거 키
      */

      const key =
        [
          getRegion(item),
          getCity(item),
          getDong(item),
          apartmentName
        ]
        .filter(Boolean)
        .join("|")
        .replace(
          /\s+/g,
          ""
        );


      if (
        apartmentKeys.has(key)
      ) {

        return false;

      }


      apartmentKeys.add(
        key
      );


      /*
      실제 아파트 단지 좌표 검색
      */

      const position =
        await findApartmentPosition(
          item
        );


      if (
        !position
      ) {

        return false;

      }


      const latLng =
        new kakao.maps.LatLng(
          position.lat,
          position.lng
        );


      /*
      풍선 표시
      */

      createApartmentOverlay(
        item,
        latLng
      );


      return true;

    }


    /*
    ==================================================
    아파트 DB 불러오기
    ==================================================
    */

    async function loadApartments() {

      const loading =
        document.getElementById(
          "loading"
        );


      try {

        loading.innerText =
          "전국 아파트 DB를 불러오는 중...";


        /*
        기존 API 그대로 사용
        */

        const response =
          await fetch(
            "/api/apt-list",
            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "아파트 DB 호출 실패"
          );

        }


        const data =
          await response.json();


        /*
        API 응답 형태 대응
        */

        let apartments =
          [];


        if (
          Array.isArray(data)
        ) {

          apartments =
            data;

        }

        else if (
          Array.isArray(
            data.apartments
          )
        ) {

          apartments =
            data.apartments;

        }

        else if (
          Array.isArray(
            data.items
          )
        ) {

          apartments =
            data.items;

        }

        else if (
          Array.isArray(
            data.data
          )
        ) {

          apartments =
            data.data;

        }


        if (
          apartments.length === 0
        ) {

          loading.innerText =
            "아파트 데이터가 없습니다.";

          return;

        }


        loading.innerText =
          "아파트 단지 위치를 찾는 중...";


        /*
        ==================================================
        중요

        DB의 각 아파트 단지명을 기준으로
        카카오 장소검색을 실시한다.

        동 하나의 좌표를 사용하는 것이 아니다.
        ==================================================
        */


        let completed =
          0;

        let found =
          0;


        const total =
          apartments.length;


        /*
        너무 많은 요청을 한꺼번에 보내지 않고
        순차적으로 처리
        */

        for (
          let i = 0;
          i < total;
          i++
        ) {

          const result =
            await processApartment(
              apartments[i]
            );


          completed++;


          if (
            result
          ) {

            found++;

          }


          loading.innerText =
            "아파트 단지 위치 확인 " +
            completed +
            " / " +
            total +
            " · 표시 " +
            found;


          /*
          카카오 검색 요청 사이에
          짧은 간격을 둔다.
          */

          await new Promise(
            function(resolve) {

              setTimeout(
                resolve,
                80
              );

            }
          );

        }


        /*
        ==================================================
        결과
        ==================================================
        */

        if (
          overlays.length > 0
        ) {

          loading.innerText =
            "아파트 지도 표시 완료 · " +
            overlays.length +
            "개";


          /*
          첫 번째 실제 아파트 위치로 이동
          */

          const firstOverlay =
            overlays[0];


          if (
            firstOverlay
          ) {

            const position =
              firstOverlay.getPosition();


            if (
              position
            ) {

              map.setCenter(
                position
              );

              map.setLevel(
                7
              );

            }

          }


          /*
          3초 후 안내창 제거
          */

          setTimeout(
            function() {

              loading.style.display =
                "none";

            },
            3000
          );

        }

        else {

          loading.innerText =
            "아파트 단지 좌표를 찾지 못했습니다.";

        }


      }
      catch (
        error
      ) {

        console.error(
          error
        );


        loading.innerText =
          "아파트 정보를 불러오지 못했습니다.";

      }

    }


    /*
    ==================================================
    시작
    ==================================================
    */

    loadApartments();

  </script>

</body>
</html>
