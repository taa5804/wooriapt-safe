<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>우리아파트 지도</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
      background: #f3f4f6;
    }

    .price-marker {
      position: relative;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 110px;
      height: 40px;

      padding: 0 13px;

      background: #0b63ce;
      color: #ffffff;

      border-radius: 20px;

      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.25);

      cursor: pointer;
    }

    .price-marker::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: -8px;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #0b63ce;
    }

    .loading {
      position: fixed;

      top: 15px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      padding: 10px 16px;

      background: rgba(0, 0, 0, 0.78);
      color: #ffffff;

      border-radius: 20px;

      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div id="loading" class="loading">
    아파트 단지를 불러오는 중...
  </div>


  <script
    type="text/javascript"
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=afb1495e5138ed5d431f6203b02a7a29&libraries=services"
  ></script>


  <script>

    /*
    ========================================
    지도
    ========================================
    */

    const map =
      new kakao.maps.Map(
        document.getElementById("map"),
        {
          center:
            new kakao.maps.LatLng(
              36.5,
              127.8
            ),
          level: 13
        }
      );


    const geocoder =
      new kakao.maps.services.Geocoder();


    /*
    ========================================
    표시된 풍선
    ========================================
    */

    const overlays = [];


    /*
    ========================================
    아파트 단지 중복 제거
    ========================================
    */

    const apartmentKeys =
      new Set();


    /*
    ========================================
    주소값 찾기
    ========================================
    */

    function getValue(
      item,
      names
    ) {

      for (
        const name of names
      ) {

        if (
          item &&
          item[name] !== undefined &&
          item[name] !== null &&
          String(item[name]).trim() !== ""
        ) {

          return String(
            item[name]
          ).trim();

        }

      }

      return "";

    }


    /*
    ========================================
    지역 정보
    ========================================
    */

    function getRegion(
      item
    ) {

      return getValue(
        item,
        [
          "시도",
          "region",
          "sido",
          "do"
        ]
      );

    }


    function getCity(
      item
    ) {

      return getValue(
        item,
        [
          "시군구",
          "city",
          "sigungu"
        ]
      );

    }


    function getDong(
      item
    ) {

      return getValue(
        item,
        [
          "읍면동",
          "읍면",
          "동리",
          "dong",
          "emd",
          "legal_dong"
        ]
      );

    }


    /*
    ========================================
    아파트 단지명
    ========================================
    */

    function getApartmentName(
      item
    ) {

      return getValue(
        item,
        [
          "단지명",
          "아파트명",
          "apt_name",
          "apartment_name",
          "apt",
          "apartment"
        ]
      );

    }


    /*
    ========================================
    전체 주소가 DB에 있으면 우선 사용
    ========================================
    */

    function getFullAddress(
      item
    ) {

      return getValue(
        item,
        [
          "도로명주소",
          "도로명",
          "road_address",
          "roadAddress",
          "주소",
          "address",
          "full_address",
          "jibun_address",
          "지번주소"
        ]
      );

    }


    /*
    ========================================
    검색 주소 생성
    ========================================
    */

    function makeSearchAddress(
      item
    ) {

      const fullAddress =
        getFullAddress(item);


      const apartmentName =
        getApartmentName(item);


      /*
      전체 주소가 있으면
      주소 + 단지명을 사용
      */

      if (
        fullAddress
      ) {

        return [
          fullAddress,
          apartmentName
        ]
        .filter(Boolean)
        .join(" ");

      }


      /*
      전체 주소가 없으면
      시도 + 시군구 + 동 + 단지명
      */

      return [
        getRegion(item),
        getCity(item),
        getDong(item),
        apartmentName
      ]
      .filter(Boolean)
      .join(" ");

    }


    /*
    ========================================
    풍선 표시
    ========================================
    */

    function createApartmentOverlay(
      item,
      position
    ) {

      const apartmentName =
        getApartmentName(item) ||
        "아파트";


      const content =
        document.createElement(
          "div"
        );


      content.className =
        "price-marker";


      content.innerText =
        "거래비용 50%↓";


      const overlay =
        new kakao.maps.CustomOverlay({

          position:
            position,

          content:
            content,

          yAnchor:
            1.35

        });


      overlay.setMap(
        map
      );


      overlays.push(
        overlay
      );


      /*
      ========================================
      풍선 클릭
      ========================================
      */

      content.addEventListener(
        "click",
        function () {

          alert(
            apartmentName +
            "\n\n" +
            "아파트 거래비용 50% 절약"
          );

        }
      );

    }


    /*
    ========================================
    단지 1개 좌표 검색
    ========================================
    */

    function geocodeApartment(
      item,
      index,
      total
    ) {

      return new Promise(
        function (
          resolve
        ) {

          const searchAddress =
            makeSearchAddress(item);


          const apartmentName =
            getApartmentName(item);


          if (
            !searchAddress ||
            !apartmentName
          ) {

            resolve();

            return;

          }


          /*
          같은 단지 중복 방지
          */

          const key =
            searchAddress
              .replace(
                /\s+/g,
                " "
              )
              .trim();


          if (
            apartmentKeys.has(key)
          ) {

            resolve();

            return;

          }


          apartmentKeys.add(
            key
          );


          geocoder.addressSearch(
            searchAddress,
            function (
              result,
              status
            ) {

              if (
                status ===
                kakao.maps.services.Status.OK &&
                result &&
                result.length > 0
              ) {

                const position =
                  new kakao.maps.LatLng(
                    Number(
                      result[0].y
                    ),
                    Number(
                      result[0].x
                    )
                  );


                createApartmentOverlay(
                  item,
                  position
                );

              }


              resolve();

            }
          );

        }
      );

    }


    /*
    ========================================
    아파트 DB 불러오기
    ========================================
    */

    async function loadApartments() {

      const loading =
        document.getElementById(
          "loading"
        );


      try {

        loading.innerText =
          "전국 아파트 DB를 불러오는 중...";


        const response =
          await fetch(
            "/api/apt-list",
            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "아파트 DB 호출 실패"
          );

        }


        const data =
          await response.json();


        /*
        API가 배열을 직접 반환하거나
        객체 안에 배열을 반환하는 경우 대응
        */

        let apartments = [];


        if (
          Array.isArray(data)
        ) {

          apartments =
            data;

        }

        else if (
          Array.isArray(
            data.apartments
          )
        ) {

          apartments =
            data.apartments;

        }

        else if (
          Array.isArray(
            data.items
          )
        ) {

          apartments =
            data.items;

        }

        else if (
          Array.isArray(
            data.data
          )
        ) {

          apartments =
            data.data;

        }


        if (
          apartments.length === 0
        ) {

          loading.innerText =
            "아파트 데이터가 없습니다.";

          return;

        }


        loading.innerText =
          "아파트 단지 위치를 찾는 중...";


        /*
        ========================================
        중요:
        동 하나의 좌표를 쓰지 않고
        각 아파트 단지별로 개별 검색
        ========================================
        */

        let completed =
          0;


        const total =
          apartments.length;


        /*
        카카오 요청을 한꺼번에 폭주시키지 않도록
        순차 처리
        */

        for (
          let i = 0;
          i < total;
          i++
        ) {

          await geocodeApartment(
            apartments[i],
            i,
            total
          );


          completed++;


          loading.innerText =
            "아파트 단지 위치 확인 " +
            completed +
            " / " +
            total;

        }


        /*
        ========================================
        전국 좌표를 모두 찾은 뒤
        적당한 위치로 이동
        ========================================
        */

        if (
          overlays.length > 0
        ) {

          loading.innerText =
            "아파트 지도 표시 완료";


          /*
          첫 번째 실제 아파트 위치로 이동
          */

          const first =
            apartments.find(
              function (item) {

                return (
                  getApartmentName(
                    item
                  ) !== ""
                );

              }
            );


          if (first) {

            const firstAddress =
              makeSearchAddress(
                first
              );


            geocoder.addressSearch(
              firstAddress,
              function (
                result,
                status
              ) {

                if (
                  status ===
                  kakao.maps.services.Status.OK
                ) {

                  map.setCenter(
                    new kakao.maps.LatLng(
                      Number(
                        result[0].y
                      ),
                      Number(
                        result[0].x
                      )
                    )
                  );

                  map.setLevel(
                    7
                  );

                }

              }
            );

          }

        }

        else {

          loading.innerText =
            "아파트 단지 좌표를 찾지 못했습니다.";

        }


      }

      catch (
        error
      ) {

        console.error(
          error
        );


        loading.innerText =
          "아파트 정보를 불러오지 못했습니다.";

      }

    }


    /*
    ========================================
    시작
    ========================================
    */

    loadApartments();

  </script>

</body>
</html>
