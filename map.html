<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>우리아파트 지도</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
      background: #f3f4f6;
    }

    .price-marker {
      position: relative;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 110px;
      height: 40px;

      padding: 0 13px;

      background: #0b63ce;
      color: #ffffff;

      border-radius: 20px;

      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.25);

      cursor: pointer;
    }

    .price-marker::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: -8px;

      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #0b63ce;
    }

    .loading {
      position: fixed;

      top: 15px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      padding: 10px 16px;

      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;

      border-radius: 20px;

      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div
    id="loading"
    class="loading"
  >
    아파트 위치를 불러오는 중...
  </div>


  <!-- 카카오 지도 SDK -->
  <script
    type="text/javascript"
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=afb1495e5138ed5d431f6203b02a7a29&libraries=services"
  ></script>


  <script>

    /*
    ========================================
    기본 지도
    ========================================
    */

    const container =
      document.getElementById("map");


    const defaultPosition =
      new kakao.maps.LatLng(
        36.5,
        127.8
      );


    const map =
      new kakao.maps.Map(
        container,
        {
          center: defaultPosition,
          level: 13
        }
      );


    /*
    ========================================
    주소 → 좌표 변환
    ========================================
    */

    const geocoder =
      new kakao.maps.services.Geocoder();


    /*
    ========================================
    풍선 문구
    ========================================
    */

    const balloonTexts = [

      "아파트 거래비용 50% 절약",

      "희망조건만 등록하세요",

      "원하는 아파트를 등록하세요",

      "매매·전세·월세 모두 가능",

      "공인중개사가 매물을 제안합니다",

      "직접 찾아다니지 마세요"

    ];


    /*
    ========================================
    현재 표시된 풍선 저장
    ========================================
    */

    let overlays = [];


    /*
    ========================================
    풍선 전부 제거
    ========================================
    */

    function clearOverlays() {

      overlays.forEach(function (overlay) {

        overlay.setMap(null);

      });

      overlays = [];

    }


    /*
    ========================================
    아파트 주소 만들기
    ========================================
    */

    function makeAddress(apt) {

      return [

        apt["시도"] || "",

        apt["시군구"] || "",

        apt["읍면"] || "",

        apt["동리"] || "",

        apt["단지명"] || ""

      ]
      .filter(Boolean)
      .join(" ");

    }


    /*
    ========================================
    풍선 생성
    ========================================
    */

    function createBalloon(
      apt,
      position,
      index
    ) {

      const markerContent =
        document.createElement("div");


      markerContent.className =
        "price-marker";


      markerContent.innerText =
        balloonTexts[
          index % balloonTexts.length
        ];


      const customOverlay =
        new kakao.maps.CustomOverlay({

          position: position,

          content: markerContent,

          yAnchor: 1.35

        });


      customOverlay.setMap(map);


      overlays.push(
        customOverlay
      );


      /*
      풍선 클릭
      */

      markerContent.addEventListener(
        "click",
        function () {

          const aptName =
            apt["단지명"] ||
            "아파트";


          alert(
            aptName +
            "\n우리아파트 안심거래\n아파트 거래비용 50% 절약"
          );

        }
      );

    }


    /*
    ========================================
    지도 화면 안의 아파트 표시
    ========================================
    */

    function displayApartments(apartments) {

      clearOverlays();


      /*
      한 화면에 너무 많은 풍선을
      동시에 띄우지 않도록 제한
      */

      const MAX_BALLOONS = 30;


      const selected =
        apartments.slice(
          0,
          MAX_BALLOONS
        );


      if (
        selected.length === 0
      ) {

        document.getElementById(
          "loading"
        ).innerText =
          "표시할 아파트가 없습니다.";

        return;

      }


      let completed = 0;


      selected.forEach(
        function (
          apt,
          index
        ) {

          const address =
            makeAddress(apt);


          if (!address) {

            completed++;

            return;

          }


          geocoder.addressSearch(
            address,
            function (
              result,
              status
            ) {

              completed++;


              if (
                status ===
                kakao.maps.services.Status.OK
              ) {

                const position =
                  new kakao.maps.LatLng(

                    Number(
                      result[0].y
                    ),

                    Number(
                      result[0].x
                    )

                  );


                createBalloon(
                  apt,
                  position,
                  index
                );

              }


              if (
                completed >=
                selected.length
              ) {

                document.getElementById(
                  "loading"
                ).style.display =
                  "none";

              }

            }
          );

        }
      );

    }


    /*
    ========================================
    전국 아파트 DB 불러오기
    ========================================
    */

    async function loadApartments() {

      const loading =
        document.getElementById(
          "loading"
        );


      loading.style.display =
        "block";


      loading.innerText =
        "아파트 정보를 불러오는 중...";


      try {

        const response =
          await fetch(
            "/api/apt-list"
          );


        if (!response.ok) {

          throw new Error(
            "아파트 DB 호출 실패"
          );

        }


        const data =
          await response.json();


        /*
        API 응답 형태가
        배열인 경우와
        객체 안 배열인 경우 모두 대응
        */

        let apartments = [];


        if (
          Array.isArray(data)
        ) {

          apartments =
            data;

        }

        else if (
          Array.isArray(
            data.apartments
          )
        ) {

          apartments =
            data.apartments;

        }

        else if (
          Array.isArray(
            data.items
          )
        ) {

          apartments =
            data.items;

        }

        else if (
          Array.isArray(
            data.data
          )
        ) {

          apartments =
            data.data;

        }


        console.log(
          "불러온 아파트:",
          apartments.length
        );


        loading.innerText =
          "아파트 위치를 표시하는 중...";


        displayApartments(
          apartments
        );

      }

      catch (error) {

        console.error(
          error
        );


        loading.innerText =
          "아파트 정보를 불러오지 못했습니다.";

      }

    }


    /*
    ========================================
    시작
    ========================================
    */

    loadApartments();

  </script>

</body>
</html>
