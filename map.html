<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전국 아파트 지도 | 우리아파트 안심거래</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}
.page{width:100%;height:100%;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;position:relative;z-index:1000}
.title{margin:0;font-size:20px;font-weight:800;color:#111827}
.sub{margin-top:5px;font-size:13px;color:#6b7280}
.status{margin-top:7px;font-size:12px;color:#2563eb}
#map{flex:1;width:100%;min-height:500px}

.apt-marker-wrap{background:transparent;border:0}
.apt-marker{position:relative;display:flex;align-items:center;gap:5px;white-space:nowrap;transform:translate(-50%,-100%)}
.apt-icon{width:28px;height:32px;position:relative;background:#1769e0;border:2px solid #fff;border-radius:4px 4px 2px 2px;box-shadow:0 2px 7px rgba(0,0,0,.25)}
.apt-icon:before{content:"";position:absolute;left:5px;top:6px;width:4px;height:4px;background:#fff;box-shadow:8px 0 #fff,0 8px #fff,8px 8px #fff,0 16px #fff,8px 16px #fff}
.apt-balloon{position:relative;padding:6px 9px;border-radius:6px;background:#fff;border:2px solid #1769e0;color:#111827;font-size:11px;font-weight:800;line-height:1.2;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.apt-balloon:before{content:"";position:absolute;left:-7px;top:50%;transform:translateY(-50%);border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:7px solid #1769e0}
.apt-popup{min-width:180px;line-height:1.5}
.apt-popup strong{display:block;margin-bottom:4px;font-size:14px}
.apt-popup .address{color:#6b7280;font-size:12px}
@media(max-width:640px){
  .title{font-size:17px}
  .sub{font-size:12px}
  .apt-icon{width:24px;height:28px}
  .apt-balloon{padding:5px 7px;font-size:10px}
}
</style>
</head>

<body>

<div class="page">

<header class="topbar">
  <h1 class="title">우리아파트 안심거래</h1>

  <div class="sub">
    전국 아파트를 지도에서 확인하세요.
  </div>

  <div id="status" class="status">
    지도를 확대하면 해당 지역의 아파트가 표시됩니다.
  </div>
</header>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";


/* =========================================
   기본 설정
========================================= */

const APT_LIST_API = "/api/apt-list";

/*
   줌 5부터 아파트 표시
*/
const MIN_ZOOM = 5;

/*
   한 번의 영역 조회 최대 건수
*/
const MAP_LIMIT = 1000;

const statusEl =
  document.getElementById("status");


/* =========================================
   확정 풍선 문구
========================================= */

const BALLOON_MESSAGES = [

  "아파트 안심거래",
  "거래비용 50% 절약",
  "매수 전용",
  "임차 전용",
  "매수 희망등록",
  "임차 희망등록",
  "매물 제안받기",
  "전자계약 안심",
  "매매·전세·월세",
  "원하는 아파트 등록",
  "희망조건만 등록",
  "직접 찾아다니지 마세요"

];


function getBalloonMessage(index) {

  return BALLOON_MESSAGES[
    index % BALLOON_MESSAGES.length
  ];

}


/* =========================================
   HTML 안전 처리
========================================= */

function esc(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

}


/* =========================================
   DB 필드
========================================= */

function getValue(row, names) {

  for (const name of names) {

    if (
      row &&
      row[name] !== undefined &&
      row[name] !== null &&
      String(row[name]).trim() !== ""
    ) {

      return String(row[name]).trim();

    }

  }

  return "";

}


function getApartmentName(row) {

  return getValue(
    row,
    [
      "kaptName",
      "단지명",
      "apartment",
      "apartment_name",
      "apt",
      "apt_name",
      "name",
      "complex_name"
    ]
  ) || "아파트";

}


function getAddress(row) {

  return getValue(
    row,
    [
      "관리사무소 연락처 주소",
      "address",
      "road_address",
      "road_address_name",
      "jibun_address",
      "jibun_address_name",
      "full_address"
    ]
  );

}


function getLatitude(row) {

  return Number(
    row?.latitude ??
    row?.lat
  );

}


function getLongitude(row) {

  return Number(
    row?.longitude ??
    row?.lng ??
    row?.lon
  );

}


/* =========================================
   API 결과 정규화
========================================= */

function normalizeRows(data) {

  if (Array.isArray(data)) {

    return data;

  }

  if (
    data &&
    Array.isArray(data.apartments)
  ) {

    return data.apartments;

  }

  if (
    data &&
    Array.isArray(data.items)
  ) {

    return data.items;

  }

  if (
    data &&
    Array.isArray(data.data)
  ) {

    return data.data;

  }

  if (
    data &&
    Array.isArray(data.rows)
  ) {

    return data.rows;

  }

  return [];

}


/* =========================================
   지도 생성
========================================= */

const map =
  L.map(
    "map",
    {
      zoomControl: true
    }
  )
  .setView(
    [36.4, 127.8],
    4
  );


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* =========================================
   마커 관리
========================================= */

const markerLayer =
  L.layerGroup().addTo(map);

let loadTimer = null;

let requestNo = 0;

let loading = false;


/* =========================================
   현재 지도 영역 조회
========================================= */

async function loadCurrentArea() {

  /*
     줌 5 미만에서는 DB 조회하지 않음
  */

  if (
    map.getZoom() < MIN_ZOOM
  ) {

    markerLayer.clearLayers();

    statusEl.textContent =
      "지도를 확대하면 해당 지역의 아파트가 표시됩니다.";

    return;

  }


  const bounds =
    map.getBounds();


  const params =
    new URLSearchParams({

      map: "1",

      minLat:
        String(
          bounds.getSouth()
        ),

      maxLat:
        String(
          bounds.getNorth()
        ),

      minLng:
        String(
          bounds.getWest()
        ),

      maxLng:
        String(
          bounds.getEast()
        ),

      limit:
        String(
          MAP_LIMIT
        )

    });


  const myRequest =
    ++requestNo;


  loading = true;


  statusEl.textContent =
    "현재 지도 영역의 아파트를 불러오는 중입니다.";


  try {

    const response =
      await fetch(
        APT_LIST_API +
        "?" +
        params.toString(),
        {
          method: "GET",
          cache: "no-store",
          headers: {
            Accept:
              "application/json"
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "API " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
       더 최근 요청이 있으면
       이전 결과를 사용하지 않음
    */

    if (
      myRequest !== requestNo
    ) {

      return;

    }


    markerLayer.clearLayers();


    const rows =
      normalizeRows(data);


    let count = 0;


    rows.forEach(
      function(row, index) {

        const lat =
          getLatitude(row);

        const lng =
          getLongitude(row);


        /*
           좌표가 없는 자료는 표시하지 않음
        */

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng)
        ) {

          return;

        }


        const html =

          '<div class="apt-marker">' +

            '<div class="apt-icon"></div>' +

            '<div class="apt-balloon">' +

              esc(
                getBalloonMessage(index)
              ) +

            '</div>' +

          '</div>';


        const icon =
          L.divIcon({

            className:
              "apt-marker-wrap",

            html:
              html,

            iconSize:
              [0, 0],

            iconAnchor:
              [0, 0]

          });


        const marker =
          L.marker(
            [lat, lng],
            {
              icon:
                icon
            }
          );


        const apartmentName =
          getApartmentName(row);


        const address =
          getAddress(row);


        marker.bindPopup(

          '<div class="apt-popup">' +

            '<strong>' +

              esc(
                apartmentName
              ) +

            '</strong>' +

            (
              address
              ? '<div class="address">' +
                  esc(address) +
                '</div>'
              : ""
            ) +

          '</div>'

        );


        markerLayer.addLayer(
          marker
        );


        count++;

      }
    );


    statusEl.textContent =
      "현재 지도 영역 아파트 " +
      count +
      "개 표시";


  } catch (error) {

    console.error(
      error
    );


    markerLayer.clearLayers();


    statusEl.textContent =
      "현재 지도 영역의 아파트를 불러오지 못했습니다.";

  } finally {

    loading = false;

  }

}


/* =========================================
   지도 이동 / 확대
========================================= */

function scheduleLoad() {

  clearTimeout(
    loadTimer
  );


  loadTimer =
    setTimeout(
      function() {

        if (!loading) {

          loadCurrentArea();

        }

      },
      350
    );

}


map.on(
  "moveend",
  scheduleLoad
);


map.on(
  "zoomend",
  scheduleLoad
);


/* =========================================
   최초 화면
========================================= */

statusEl.textContent =
  "지도를 확대하면 해당 지역의 아파트가 표시됩니다.";

</script>

</body>
</html>
