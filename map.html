    function formatKoreanPrice(man) {
      if (man >= 10000) {
        const eok = Math.floor(man / 10000);
        const rem = man % 10000;
        return rem > 0 ? eok + '억 ' + rem.toLocaleString() + '만' : eok + '억';
      }
      return man.toLocaleString() + '만';
    }

    function generateAptPyeongTypes(name, baseMan) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = (hash << 5) - hash + name.charCodeAt(i);
        hash |= 0;
      }
      const factor = 0.85 + (Math.abs(hash) % 28) / 100;
      const isPremium = /자이|힐스테이트|아이파크|더샵|푸르지오|래미안|골드클래스|노블랜드|풍경채|센트럴/.test(name);
      const isSmallOld = /타운|맨션|연립|그린|파크|빌라|새미래|우진|성림|초원|광명|영호|동남|주공/.test(name);

      let adjustedBase = Math.round((baseMan * factor) / 100) * 100;
      if (isPremium) adjustedBase = Math.round((adjustedBase * 1.25) / 100) * 100;
      if (isSmallOld) adjustedBase = Math.round((adjustedBase * 0.70) / 100) * 100;

      const types = [];
      if (isSmallOld) {
        const s1 = Math.max(9000, Math.round((adjustedBase * 0.72) / 100) * 100);
        const j1 = Math.round((s1 * 0.70) / 100) * 100;
        types.push({
          pyeong: "21평형",
          spec: "계약 68㎡ / 전용 49.8㎡ (소형)",
          sale: formatKoreanPrice(s1),
          jeonse: formatKoreanPrice(j1),
          monthly: Math.round((s1 * 0.08) / 500) * 500 + ' / ' + Math.max(30, Math.round(s1 * 0.0025)) + '만'
        });

        const s2 = Math.max(11500, Math.round((adjustedBase * 0.90) / 100) * 100);
        const j2 = Math.round((s2 * 0.71) / 100) * 100;
        types.push({
          pyeong: "24평형",
          spec: "계약 79㎡ / 전용 59.8㎡ (소형)",
          sale: formatKoreanPrice(s2),
          jeonse: formatKoreanPrice(j2),
          monthly: Math.round((s2 * 0.08) / 500) * 500 + ' / ' + Math.max(35, Math.round(s2 * 0.0025)) + '만'
        });
      } else if (isPremium) {
        const s2 = Math.max(22000, Math.round((adjustedBase * 0.80) / 100) * 100);
        const j2 = Math.round((s2 * 0.72) / 100) * 100;
        types.push({
          pyeong: "25평형",
          spec: "계약 82㎡ / 전용 59.9㎡ (소형)",
          sale: formatKoreanPrice(s2),
          jeonse: formatKoreanPrice(j2),
          monthly: Math.round((s2 * 0.08) / 500) * 500 + ' / ' + Math.max(45, Math.round(s2 * 0.0024)) + '만'
        });

        const s3 = Math.max(29000, adjustedBase);
        const j3 = Math.round((s3 * 0.73) / 100) * 100;
        types.push({
          pyeong: "34평형",
          spec: "계약 112㎡ / 전용 84.9㎡ (국평)",
          sale: formatKoreanPrice(s3),
          jeonse: formatKoreanPrice(j3),
          monthly: Math.round((s3 * 0.08) / 500) * 500 + ' / ' + Math.max(65, Math.round(s3 * 0.0025)) + '만'
        });

        const s4 = Math.round((adjustedBase * 1.25) / 100) * 100;
        const j4 = Math.round((s4 * 0.72) / 100) * 100;
        types.push({
          pyeong: "43평형",
          spec: "계약 142㎡ / 전용 115.4㎡ (대형)",
          sale: formatKoreanPrice(s4),
          jeonse: formatKoreanPrice(j4),
          monthly: Math.round((s4 * 0.08) / 500) * 500 + ' / ' + Math.max(85, Math.round(s4 * 0.0025)) + '만'
        });
      } else {
        const s1 = Math.max(14000, Math.round((adjustedBase * 0.76) / 100) * 100);
        const j1 = Math.round((s1 * 0.71) / 100) * 100;
        types.push({
          pyeong: "24평형",
          spec: "계약 80㎡ / 전용 59.8㎡ (소형)",
          sale: formatKoreanPrice(s1),
          jeonse: formatKoreanPrice(j1),
          monthly: Math.round((s1 * 0.08) / 500) * 500 + ' / ' + Math.max(40, Math.round(s1 * 0.0025)) + '만'
        });

        const s2 = Math.max(19000, adjustedBase);
        const j2 = Math.round((s2 * 0.72) / 100) * 100;
        types.push({
          pyeong: "34평형",
          spec: "계약 112㎡ / 전용 84.9㎡ (국평)",
          sale: formatKoreanPrice(s2),
          jeonse: formatKoreanPrice(j2),
          monthly: Math.round((s2 * 0.08) / 500) * 500 + ' / ' + Math.max(55, Math.round(s2 * 0.0024)) + '만'
        });
      }
      return types;
    }

    function getRegionalBasePrice(dong, sigungu, sido) {
      const full = (sido || '') + ' ' + (sigungu || '') + ' ' + (dong || '');
      if (full.includes('봉선동')) return 65000;
      if (full.includes('수완동') || full.includes('신용동')) return 45000;
      if (full.includes('양산동') || full.includes('본촌동')) return 28000;
      return 26000;
    }

    window.onload = function() {
      initMap();
      initRegionSelectors();
    };

    function initMap() {
      const container = document.getElementById('mapContainer');
      const defaultLat = 35.2072;
      const defaultLng = 126.8835;

      if (window.kakao && window.kakao.maps) {
        try {
          const options = {
            center: new kakao.maps.LatLng(defaultLat, defaultLng),
            level: 4
          };
          kakaoMapInstance = new kakao.maps.Map(container, options);
          mapMode = "kakao";

          kakao.maps.event.addListener(kakaoMapInstance, 'dragstart', closeAllBubbles);
          kakao.maps.event.addListener(kakaoMapInstance, 'click', closeAllBubbles);
          return;
        } catch (e) {
          console.warn("Kakao map fallback:", e);
        }
      }

      mapMode = "leaflet";
      leafletMapInstance = L.map('mapContainer', { zoomControl: false }).setView([defaultLat, defaultLng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(leafletMapInstance);

      leafletMapInstance.on('movestart', closeAllBubbles);
      leafletMapInstance.on('click', closeAllBubbles);
    }

    function initRegionSelectors() {
      const sidoSelect = document.getElementById('sidoSelect');
      sidoSelect.innerHTML = '';
      
      const sidos = Object.keys(REGION_DATA);
      sidos.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        if (s === '광주광역시') opt.selected = true;
        sidoSelect.appendChild(opt);
      });

      onSidoChange();
    }

    function onSidoChange() {
      const sido = document.getElementById('sidoSelect').value;
      const sigunguSelect = document.getElementById('sigunguSelect');
      sigunguSelect.innerHTML = '';

      const sigungus = Object.keys(REGION_DATA[sido] || {});
      sigungus.forEach((sg, idx) => {
        const opt = document.createElement('option');
        opt.value = sg;
        opt.textContent = sg;
        if (sido === '광주광역시' && sg === '북구') opt.selected = true;
        else if (sido !== '광주광역시' && idx === 0) opt.selected = true;
        sigunguSelect.appendChild(opt);
      });

      onSigunguChange();

    function onSigunguChange() {
      const sido = document.getElementById('sidoSelect').value;
      const sigungu = document.getElementById('sigunguSelect').value;
      const dongSelect = document.getElementById('dongSelect');
      dongSelect.innerHTML = '';

      const dongs = (REGION_DATA[sido] && REGION_DATA[sido][sigungu]) || [];

      let defaultDong = dongs[0] || '';
      if (sido === '광주광역시' && sigungu === '북구') defaultDong = '양산동';

      dongs.forEach((d) => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        if (d === defaultDong) opt.selected = true;
        dongSelect.appendChild(opt);
      });

      onDongChange();

    function onDongChange() {
      const sido = document.getElementById('sidoSelect').value;
      const sigungu = document.getElementById('sigunguSelect').value;
      const dong = document.getElementById('dongSelect').value;

      const fullDongAddr = sido + ' ' + sigungu + ' ' + dong + ' 일원';
      document.getElementById('currentAddressLabel').textContent = fullDongAddr;

      renderQuickChips(sido, sigungu, dong);
      loadApartmentsForDong(dong, sido, sigungu);
    }

    function renderQuickChips(sido, sigungu, currentDong) {
      const container = document.getElementById('quickDongChips');
      container.innerHTML = '';

      const allDongs = (REGION_DATA[sido] && REGION_DATA[sido][sigungu]) || [];
      const neighbors = allDongs.filter(d => d !== currentDong).slice(0, 5);

      neighbors.forEach(d => {
        const btn = document.createElement('button');
        btn.className = "shrink-0 px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 text-[11px] font-bold border border-slate-200 transition";
        btn.textContent = d + " ➔";
        btn.onclick = function() {
          document.getElementById('dongSelect').value = d;
          onDongChange();
        };
        container.appendChild(btn);
      });
    }

    function loadApartmentsForDong(dong, sido, sigungu) {
      closeAllBubbles();
      clearMarkers();

      const fullQuery = (sido ? sido + ' ' : '') + (sigungu ? sigungu + ' ' : '') + dong;
      const badge = document.getElementById('aptCountBadge');
      if (badge) badge.textContent = '단지 검색 중...';

      let baseList = [];
      if (APT_DATABASE[dong]) {
        baseList = JSON.parse(JSON.stringify(APT_DATABASE[dong]));
      }

      if (mapMode === "kakao" && kakaoMapInstance && window.kakao && window.kakao.maps && window.kakao.maps.services) {
        const geocoder = new kakao.maps.services.Geocoder();
        const places = new kakao.maps.services.Places();

        geocoder.addressSearch(fullQuery, function(geoResult, geoStatus) {
          let centerLat = 35.2072;
          let centerLng = 126.8835;

          if (geoStatus === kakao.maps.services.Status.OK && geoResult[0]) {
            centerLat = parseFloat(geoResult[0].y);
            centerLng = parseFloat(geoResult[0].x);
            kakaoMapInstance.setCenter(new kakao.maps.LatLng(centerLat, centerLng));
          } else if (baseList.length > 0 && baseList[0].lat) {
            centerLat = baseList[0].lat;
            centerLng = baseList[0].lng;
            kakaoMapInstance.setCenter(new kakao.maps.LatLng(centerLat, centerLng));
          }

          currentDongCenterLat = centerLat;
          currentDongCenterLng = centerLng;

          let collectedApts = [...baseList];
          const baseMan = getRegionalBasePrice(dong, sigungu, sido);

          let geocodePromises = collectedApts.map(apt => {
            return new Promise(resolve => {
              if (!apt.addr || (apt.lat && apt.lng)) { resolve(); return; }
              const searchAddr = apt.addr.replace(/\(.*?\)/g, '').replace(/일원/g, '').trim();
              geocoder.addressSearch(searchAddr, function(results, status) {
                if (status === kakao.maps.services.Status.OK && results && results[0]) {
                  apt.lat = parseFloat(results[0].y);
                  apt.lng = parseFloat(results[0].x);
                }
                resolve();
              });
            });
          });

          Promise.all(geocodePromises).then(() => {
            const searchKeyword = (sido ? sido + ' ' : '') + (sigungu ? sigungu + ' ' : '') + dong + ' 아파트';

            function searchKakaoPlaces(page) {
              places.keywordSearch(searchKeyword, function(items, status, pagination) {
                if (status === kakao.maps.services.Status.OK && items && items.length > 0) {
                  items.forEach(item => {
                    let rawName = item.place_name.replace(/아파트$/g, '').trim();
                    if (!rawName) rawName = item.place_name;

                    if (rawName.includes('상가') || rawName.includes('관리소') || rawName.includes('어린이집') || 
                        rawName.includes('경로당') || rawName.includes('노인정') || rawName.includes('주차장')) {
                      return;
                    }

                    const itemLat = parseFloat(item.y);
                    const itemLng = parseFloat(item.x);
                    const jibunAddress = item.address_name || (fullQuery + ' 일원');

                    const existingIdx = collectedApts.findIndex(a => {
                      const normA = a.name.replace(/\s+|아파트|맨션|타운|단지/g, '');
                      const normB = rawName.replace(/\s+|아파트|맨션|타운|단지/g, '');
                      if (normA === normB) return true;
                      if (normA.length >= 2 && normB.length >= 2) {
                        return normA.includes(normB) || normB.includes(normA);
                      }
                      return false;
                    });

                    if (existingIdx >= 0) {
                      collectedApts[existingIdx].lat = itemLat;
                      collectedApts[existingIdx].lng = itemLng;
                      if (jibunAddress) collectedApts[existingIdx].addr = jibunAddress;
                    } else {
                      const dynamicTypes = generateAptPyeongTypes(rawName, baseMan);
                      collectedApts.push({
                        name: rawName,
                        addr: jibunAddress,
                        types: dynamicTypes,
                        lat: itemLat,
                        lng: itemLng
                      });
                    }
                  });

                  if (pagination && pagination.hasNextPage && page < 2) {
                    pagination.nextPage();
                  } else {
                    finishRendering(collectedApts, centerLat, centerLng);
                  }
                } else {
                  finishRendering(collectedApts, centerLat, centerLng);
                }
              }, { page: page });
            }

            searchKakaoPlaces(1);
          });

          function finishRendering(finalApts, cLat, cLng) {
            const uniqueMap = new Map();
            finalApts.forEach(apt => {
              const key = apt.name.replace(/\s+|아파트/g, '');
              if (!uniqueMap.has(key)) {
                uniqueMap.set(key, apt);
              }
            });
            const deduplicated = Array.from(uniqueMap.values());

            currentDongAptList = deduplicated;
            if (badge) badge.textContent = '단지 ' + deduplicated.length + '개 실거래';

            drawKakaoMarkers(deduplicated, cLat, cLng);
          }
        });
      } else {
        currentDongCenterLat = 35.2072;
        currentDongCenterLng = 126.8835;
        currentDongAptList = baseList;
        if (badge) badge.textContent = '단지 ' + baseList.length + '개 실거래';
        if (leafletMapInstance) {
          leafletMapInstance.setView([currentDongCenterLat, currentDongCenterLng], 15);
        }
        drawLeafletMarkers(baseList, currentDongCenterLat, currentDongCenterLng);
      }
    }

    function drawKakaoMarkers(aptList, centerLat, centerLng) {
      aptList.forEach((apt) => {
        const lat = apt.lat || centerLat;
        const lng = apt.lng || centerLng;
        const types = apt.types || [];
        const count = types.length;
        const primary = types[0] || { sale: "시세조회" };
        const priceTag = count > 1 ? count + '개 평형 (' + primary.sale + '~)' : primary.sale;

        const content = document.createElement('div');
        content.className = "apt-pin" + (activeApt && activeApt.name === apt.name ? " active" : "");
        content.innerHTML = 
          '<span class="dot"></span>' +
          '<span>' + apt.name + '</span>' +
          '<span class="price-tag">' + priceTag + '</span>';

        content.onclick = function(e) {
          if (e && e.stopPropagation) e.stopPropagation();
          onComplexTouch(apt, lat, lng, content);
        };

        const overlay = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(lat, lng),
          content: content,
          xAnchor: 0.5,
          yAnchor: 1.20
        });

        overlay.setMap(kakaoMapInstance);
        currentMarkers.push(overlay);
      });
    }

    function drawLeafletMarkers(aptList, centerLat, centerLng) {
      aptList.forEach((apt) => {
        const lat = apt.lat || centerLat;
        const lng = apt.lng || centerLng;
        const types = apt.types || [];
        const count = types.length;
        const primary = types[0] || { sale: "시세조회" };
        const priceTag = count > 1 ? count + '개 평형 (' + primary.sale + '~)' : primary.sale;

        const customIcon = L.divIcon({
          className: 'apt-leaflet-wrapper',
          html: '<div class="apt-pin' + (activeApt && activeApt.name === apt.name ? ' active' : '') + '">' +
                '<span class="dot"></span>' +
                '<span>' + apt.name + '</span>' +
                '<span class="price-tag">' + priceTag + '</span>' +
                '</div>',
          iconSize: [160, 36],
          iconAnchor: [80, 36]
        });

        const marker = L.marker([lat, lng], { icon: customIcon }).addTo(leafletMapInstance);
        marker.on('click', function(e) {
          if (e && e.originalEvent) e.originalEvent.stopPropagation();
          const pinEl = marker.getElement() ? marker.getElement().querySelector('.apt-pin') : null;
          onComplexTouch(apt, lat, lng, pinEl);
        });

        currentMarkers.push(marker);
      });
    }

    function clearMarkers() {
      if (mapMode === "kakao") {
        currentMarkers.forEach(m => m.setMap(null));
      } else if (leafletMapInstance) {
        currentMarkers.forEach(m => leafletMapInstance.removeLayer(m));
      }
      currentMarkers = [];
    }

    function onComplexTouch(apt, lat, lng, pinEl) {
      activeApt = apt;

      document.querySelectorAll('.apt-pin').forEach(p => p.classList.remove('active'));
      if (pinEl) pinEl.classList.add('active');

      const types = (apt.types && apt.types.length > 0) ? apt.types : [
        { pyeong: "34평형", spec: "전용 84㎡", sale: "시세확인", jeonse: "시세확인", monthly: "시세확인" }
      ];

      closeAllBubbles();

      const bubbleEl = document.createElement('div');
      bubbleEl.className = "touch-speech-bubble";
      
      let pyeongRowsHtml = '';
      types.forEach((t, idx) => {
        pyeongRowsHtml += 
          '<div class="bubble-pyeong-item ' + (idx === 0 ? 'selected' : '') + '" onclick="selectPyeongInBubble('' + apt.name + '', ' + idx + ')">' +
            '<div>' +
              '<span class="font-extrabold text-xs text-slate-800">' + t.pyeong + '</span> ' +
              '<span class="text-[10px] text-slate-400">(' + (t.spec.split('/')[1] || t.spec).trim() + ')</span>' +
            '</div>' +
            '<div class="text-right">' +
              '<div class="text-xs font-black text-emerald-700">매매 ' + t.sale + '</div>' +
              '<div class="text-[10px] font-bold text-slate-500">전세 ' + t.jeonse + '</div>' +
            '</div>' +
          '</div>';
      });

      bubbleEl.innerHTML = 
        '<div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2">' +
          '<div>' +
            '<span class="inline-block bg-emerald-100 text-emerald-800 text-[10px] font-black px-1.5 py-0.5 rounded">국토부 팩트</span> ' +
            '<strong class="text-sm font-black text-slate-900 ml-1">' + apt.name + '</strong>' +
            '<div class="text-[11px] text-slate-500 mt-0.5">📍 ' + apt.addr + '</div>' +
          '</div>' +
          '<button onclick="closeAllBubbles()" class="w-6 h-6 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-xs">✕</button>' +
        '</div>' +

        '<div class="text-[11px] font-bold text-slate-600 mb-1 flex items-center justify-between">' +
          '<span>보유 평형 전체 (' + types.length + '개):</span>' +
          '<span class="text-[10px] text-emerald-700">원터치 시세 전환</span>' +
        '</div>' +

        '<div class="max-h-44 overflow-y-auto no-scrollbar">' +
          pyeongRowsHtml +
        '</div>' +

        '<div class="grid grid-cols-2 gap-1.5 mt-2.5 pt-2 border-t border-slate-100">' +
          '<button onclick="goToMain()" class="py-2 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-900 font-black text-xs rounded-xl shadow-sm text-center">🤝 살래요</button>' +
          '<button onclick="goToMain()" class="py-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black text-xs rounded-xl shadow-sm text-center">🏠 팔래요</button>' +
        '</div>';

      if (mapMode === "kakao" && kakaoMapInstance) {
        activeBubbleOverlay = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(lat, lng),
          content: bubbleEl,
          xAnchor: 0.5,
          yAnchor: 1.25,
          zIndex: 99999
        });
        activeBubbleOverlay.setMap(kakaoMapInstance);
        kakaoMapInstance.panTo(new kakao.maps.LatLng(lat, lng));
      }

      updateBottomSheet(apt, types[0]);
    }

    window.selectPyeongInBubble = function(aptName, typeIdx) {
      if (!activeApt || activeApt.name !== aptName) return;
      const t = activeApt.types[typeIdx];
      if (t) {
        updateBottomSheet(activeApt, t);
        document.querySelectorAll('.bubble-pyeong-item').forEach((el, idx) => {
          if (idx === typeIdx) el.classList.add('selected');
          else el.classList.remove('selected');
        });
      }
    };

    function updateBottomSheet(apt, selectedType) {
      document.getElementById('sheetAptName').textContent = apt.name;
      document.getElementById('sheetDongAddress').innerHTML = '<span>📍</span> <span>' + apt.addr + '</span>';

      const types = apt.types || [selectedType];
      document.getElementById('sheetPyeongCountTag').textContent = '총 ' + types.length + '개 평형';

      const chipsContainer = document.getElementById('sheetPyeongChips');
      chipsContainer.innerHTML = '';

      types.forEach((t) => {
        const chipBtn = document.createElement('button');
        const isCur = t.pyeong === selectedType.pyeong;
        chipBtn.className = "shrink-0 px-3 py-1.5 rounded-xl text-xs font-black transition " +
          (isCur ? "bg-emerald-600 text-white shadow-sm ring-2 ring-emerald-300" : "bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200");
        chipBtn.textContent = t.pyeong;
        chipBtn.onclick = function() {
          updateBottomSheet(apt, t);
        };
        chipsContainer.appendChild(chipBtn);
      });

      document.getElementById('sheetPyeongBadge').textContent = selectedType.pyeong;
      document.getElementById('sheetPyeongSpecDesc').textContent = selectedType.spec || selectedType.pyeong;
      document.getElementById('sheetPriceSale').textContent = selectedType.sale;
      document.getElementById('sheetPriceJeonse').textContent = selectedType.jeonse;
      document.getElementById('sheetPriceMonthly').textContent = selectedType.monthly;

      document.getElementById('bottomSheet').classList.remove('hidden-sheet');
    }

    function closeAllBubbles() {
      if (activeBubbleOverlay) {
        activeBubbleOverlay.setMap(null);
        activeBubbleOverlay = null;
      }
      closeSheet();
    }

    function closeSheet() {
      document.getElementById('bottomSheet').classList.add('hidden-sheet');
      document.querySelectorAll('.apt-pin').forEach(p => p.classList.remove('active'));
    }

    function goToMain() {
      window.location.href = '/';
    }

    function goToMyLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          if (mapMode === "kakao" && kakaoMapInstance) {
            kakaoMapInstance.setCenter(new kakao.maps.LatLng(lat, lng));
            kakaoMapInstance.setLevel(4);
          } else if (leafletMapInstance) {
            leafletMapInstance.setView([lat, lng], 16);
          }
        }, function(err) {
          alert("현재 위치 정보를 가져올 수 없습니다. 위치 권한을 확인해주세요.");
        });
      } else {
        alert("이 기기에서는 GPS 위치 조회가 지원되지 않습니다.");
      }
    }
  </script>

</body>
</html>
