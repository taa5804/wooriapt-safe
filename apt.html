      // 3. 양산동 월세
      { dong: '양산동', name: '양산 호반리젠시빌 1차', spec: '24평 / 59㎡', type: 'rent', price: 2000, monthly: 60, floor: '6층', date: '2026.09' },
      { dong: '양산동', name: '양산 GS자이', spec: '24평 / 59㎡', type: 'rent', price: 2000, monthly: 65, floor: '11층', date: '2026.09' },
      { dong: '양산동', name: '양산 일신아파트', spec: '24평 / 59㎡', type: 'rent', price: 1000, monthly: 50, floor: '8층', date: '2026.08' },
      { dong: '양산동', name: '양산 해태아파트', spec: '24평 / 59㎡', type: 'rent', price: 2000, monthly: 55, floor: '10층', date: '2026.09' },
      { dong: '양산동', name: '양산타운', spec: '24평 / 59㎡', type: 'rent', price: 1000, monthly: 45, floor: '5층', date: '2026.08' },
      { dong: '양산동', name: '양산 GS자이', spec: '34평 / 84㎡', type: 'rent', price: 3000, monthly: 80, floor: '15층', date: '2026.09' }
    ];

    let curType = 'sale';
    let curBudget = 20000; // 2억 원 (만원 단위)

    function switchMode(type) {
      curType = type;
      const headerBox = document.getElementById('header-box');
      headerBox.className = 'top-header' + (type === 'jeonse' ? ' theme-jeonse' : (type === 'rent' ? ' theme-rent' : ''));

      ['sale', 'jeonse', 'rent'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('active', t === type);
      });

      const budgetLabel = document.getElementById('budget-label-txt');
      if (type === 'sale') {
        budgetLabel.textContent = '희망 매매 예산 (숫자 직접 입력)';
        curBudget = 20000;
      } else if (type === 'jeonse') {
        budgetLabel.textContent = '희망 전세 보증금 (숫자 직접 입력)';
        curBudget = 15000;
      } else {
        budgetLabel.textContent = '희망 월세 보증금 (숫자 직접 입력)';
        curBudget = 2000;
      }

      document.getElementById('target-budget-num').value = curBudget;
      updateKoreanText();
      renderPresets();
      renderAptList();
    }

    function handleDongChange() {
      const val = document.getElementById('target-dong').value.trim() || '양산동';
      document.getElementById('dong-sublabel').textContent = val;
      renderAptList();
    }

    function handleBudgetNumChange() {
      const val = parseFloat(document.getElementById('target-budget-num').value) || 0;
      curBudget = val;
      updateKoreanText();
      renderPresets();
      renderAptList();
    }

    function updateKoreanText() {
      document.getElementById('budget-korean-txt').textContent = fmtMoney(curBudget);
    }

    function selectBudgetPreset(p) {
      curBudget = p;
      document.getElementById('target-budget-num').value = p;
      updateKoreanText();
      renderPresets();
      renderAptList();
    }

    function renderPresets() {
      const container = document.getElementById('preset-container');
      let presets = [];
      if (curType === 'sale') presets = [15000, 20000, 25000, 30000, 40000];
      else if (curType === 'jeonse') presets = [10000, 15000, 20000, 25000];
      else presets = [1000, 2000, 3000, 5000];

      container.innerHTML = presets.map(p => `
        <button class="preset-btn ${p === curBudget ? 'active' : ''}" onclick="selectBudgetPreset(${p})">
          ${fmtMoney(p)}
        </button>
      `).join('');
    }

    function fmtMoney(val) {
      if (val <= 0) return '0원';
      if (val >= 10000) {
        const eok = Math.floor(val / 10000);
        const man = val % 10000;
        return man > 0 ? `${eok}억 ${man.toLocaleString()}만 원` : `${eok}억 원`;
      }
      return `${val.toLocaleString()}만 원`;
    }

    function renderAptList() {
      const container = document.getElementById('apt-container');
      const dongInput = document.getElementById('target-dong').value.trim();
      const cleanDong = dongInput.split(' ').pop() || '양산동';

      // 넉넉한 예산 오차 범위 (70% ~ 135%)
      const minB = curBudget * 0.7;
      const maxB = curBudget * 1.35;

      // Filter by type & budget
      let filtered = APTS_DB.filter(a => a.type === curType && a.price >= minB && a.price <= maxB);

      // If typed another dong, dynamically adapt apartment names to match the typed dong
      if (cleanDong && cleanDong !== '양산동') {
        filtered = filtered.map(item => ({
          ...item,
          name: item.name.replace(/양산|일곡/g, cleanDong)
        }));
      }

      const typeKorean = curType === 'sale' ? '매매' : (curType === 'jeonse' ? '전세' : '월세');
      document.getElementById('results-summary').textContent = `🔍 ${cleanDong} ${fmtMoney(curBudget)} 언저리 국토부 ${typeKorean} 매물`;
      document.getElementById('results-count').textContent = `${filtered.length}개 단지 발견`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:35px 20px; color:#64748b; background:#fff; border-radius:12px; border:1px dashed #cbd5e1;">
            <div style="font-size:22px; margin-bottom:6px;">🔎</div>
            <div style="font-size:13.5px; font-weight:800; color:#1e293b;">해당 예산 범위의 실거래 아파트가 없습니다.</div>
            <div style="font-size:12px; color:#94a3b8; margin-top:4px;">예산 숫자를 조금 조절하시거나 위의 버튼을 눌러보세요.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(apt => {
        let badgeClass = 'badge-sale';
        let benefitClass = 'benefit-sale';
        let priceText = '';
        let benefitText = '';

        if (curType === 'sale') {
          badgeClass = 'badge-sale';
          benefitClass = 'benefit-sale';
          priceText = `실거래 ${fmtMoney(apt.price)}`;
          const savedFee = Math.round(apt.price * 0.002);
          benefitText = `<span>우리아파트 수수료 50% 절약</span><span class="benefit-save">➔ ${savedFee}만 원 즉시 절약</span>`;
        } else if (curType === 'jeonse') {
          badgeClass = 'badge-jeonse';
          benefitClass = 'benefit-jeonse';
          priceText = `전세 ${fmtMoney(apt.price)}`;
          const savedFee = Math.round(apt.price * 0.0015);
          benefitText = `<span>🛡️ HUG 126% 보증보험 안전</span><span class="benefit-save">➔ 수수료 만 원 절약</span>`;
        } else {
          badgeClass = 'badge-rent';
          benefitClass = 'benefit-rent';
          priceText = `보증금 ${apt.price.toLocaleString()}만 / 월 ${apt.monthly}만`;
          benefitText = `<span>🔒 최우선변제 100% 전액보호</span><span class="benefit-save">➔ 수수료 17만 원 절약</span>`;
        }

        return `
          <div class="apt-card">
            <div class="apt-name">
              <span>${apt.name} (${apt.spec})</span>
              <span class="apt-floor">${apt.floor}</span>
            </div>
            <div class="price-row">
              <span class="price-badge ${badgeClass}">${priceText}</span>
              <span class="price-date">${apt.date} 국토부 신고</span>
            </div>
            <div class="benefit-box ${benefitClass}">
              ${benefitText}
            </div>
          </div>
        `;
      }).join('');
    }

    // Initial run
    switchMode('sale');
  
    function shareLink() {
      const url = 'https://www.wooriapt.app/apt';
      const title = '내 예산 맞춤 아파트 국토부 실거래 자동 매칭기';
      const text = '동네와 예산만 넣으면 살 수 있는 실거래 아파트가 1초 만에 자동 매칭됩니다! 수수료 50% 절약 혜택도 확인해 보세요.';
      if (navigator.share) {
        navigator.share({ title, text, url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => {
          alert('우리동네 아파트 자동 매칭기 링크가 복사되었습니다! 카카오톡이나 밴드에 붙여넣어 보세요: ' + url);
        }).catch(() => {
          prompt('아래 링크를 복사하여 공유하세요:', url);
        });
      }
    }
  </script>
  
</body>
