      const sigunguSel = document.getElementById('sel-sigungu');
      const list = REGIONS[sido] || ['전체'];
      sigunguSel.innerHTML = list.map(g => '<option value="' + g + '" ' + (g === curSigungu ? 'selected' : '') + '>' + g + '</option>').join('');
      if (!list.includes(curSigungu)) {
        curSigungu = list[0];
        sigunguSel.value = curSigungu;
      }
    }

    function handleSidoChange() {
      curSido = document.getElementById('sel-sido').value;
      populateSigungu(curSido);
      handleSigunguChange();
    }

    function handleSigunguChange() {
      curSigungu = document.getElementById('sel-sigungu').value;
      // smart dong default per gu
      if (curSigungu === '북구') curDong = '양산동';
      else if (curSigungu === '광산구') curDong = '수완동';
      else if (curSigungu === '서구') curDong = '치평동';
      else if (curSigungu === '남구') curDong = '봉선동';
      else if (curSigungu === '동구') curDong = '학동';
      else curDong = curSigungu + ' 중심가';

      document.getElementById('target-dong').value = curDong;
      updateDisplayLabels();
      renderAptList();
    }

    function handleDongChange() {
      curDong = document.getElementById('target-dong').value.trim() || '중심가';
      updateDisplayLabels();
      renderAptList();
    }

    function updateDisplayLabels() {
      const full = curSido + ' ' + curSigungu + ' ' + curDong;
      document.getElementById('region-display-txt').textContent = full;
      document.getElementById('header-title').textContent = curSido + ' ' + curSigungu + ' - 안심거래 매칭기';
    }

    function switchMode(type) {
      curType = type;
      const headerBox = document.getElementById('header-box');
      headerBox.className = 'top-header' + (type === 'jeonse' ? ' theme-jeonse' : (type === 'rent' ? ' theme-rent' : ''));

      ['sale', 'jeonse', 'rent'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('active', t === type);
      });

      const budgetLabel = document.getElementById('budget-label-txt');
      if (type === 'sale') {
        budgetLabel.textContent = '희망 매매 예산';
        curBudget = 20000;
      } else if (type === 'jeonse') {
        budgetLabel.textContent = '희망 전세 보증금';
        curBudget = 15000;
      } else {
        budgetLabel.textContent = '희망 월세 보증금';
        curBudget = 2000;
      }

      document.getElementById('target-budget-num').value = curBudget;
      updateKoreanText();
      renderPresets();
      renderAptList();
    }

    function handleBudgetNumChange() {
      curBudget = parseFloat(document.getElementById('target-budget-num').value) || 0;
      updateKoreanText();
      renderPresets();
      renderAptList();
    }

    function updateKoreanText() {
      document.getElementById('budget-korean-txt').textContent = fmtMoney(curBudget);
    }

    function selectBudgetPreset(p) {
      curBudget = p;
      document.getElementById('target-budget-num').value = p;
      updateKoreanText();
      renderPresets();
      renderAptList();
    }

    function renderPresets() {
      const container = document.getElementById('preset-container');
      let presets = [];
      if (curType === 'sale') presets = [15000, 20000, 25000, 30000, 40000];
      else if (curType === 'jeonse') presets = [10000, 15000, 20000, 25000];
      else presets = [1000, 2000, 3000, 5000];

      container.innerHTML = presets.map(p => 
        '<button class="preset-btn ' + (p === curBudget ? 'active' : '') + '" onclick="selectBudgetPreset(' + p + ')">' +
          fmtMoney(p) +
        '</button>'
      ).join('');
    }

    function fmtMoney(val) {
      if (val <= 0) return '0원';
      if (val >= 10000) {
        const eok = Math.floor(val / 10000);
        const man = val % 10000;
        return man > 0 ? (eok + '억 ' + man.toLocaleString() + '만 원') : (eok + '억 원');
      }
      return val.toLocaleString() + '만 원';
    }

    function renderAptList() {
      const container = document.getElementById('apt-container');
      const minB = curBudget * 0.7;
      const maxB = curBudget * 1.35;

      // Filter by Gu, Type & Budget
      let filtered = APTS_DB.filter(a => a.type === curType && (a.gu === curSigungu || a.dong === curDong));
      if (filtered.length === 0) {
        filtered = APTS_DB.filter(a => a.type === curType);
      }
      filtered = filtered.filter(a => a.price >= minB && a.price <= maxB);

      const typeKo = curType === 'sale' ? '매매' : (curType === 'jeonse' ? '전세' : '월세');
      document.getElementById('results-summary').textContent = '🔍 ' + curSido + ' ' + curSigungu + ' ' + curDong + ' ' + fmtMoney(curBudget) + ' 국토부 ' + typeKo;
      document.getElementById('results-count').textContent = filtered.length + '개 단지 발견';

      if (filtered.length === 0) {
        container.innerHTML = 
          '<div style="text-align:center; padding:32px 20px; color:#64748b; background:#fff; border-radius:12px;">' +
            '<div style="font-size:20px; margin-bottom:5px;">🔎</div>' +
            '<div style="font-size:13.5px; font-weight:800; color:#1e293b;">해당 예산 범위의 실거래 아파트가 없습니다.</div>' +
            '<div style="font-size:12px; color:#94a3b8; margin-top:3px;">예산 숫자를 조절해 보세요.</div>' +
          '</div>';
        return;
      }

      container.innerHTML = filtered.map(apt => {
        let badgeClass = 'badge-sale';
        let benefitClass = 'benefit-sale';
        let priceText = '';
        let benefitText = '';

        if (curType === 'sale') {
          badgeClass = 'badge-sale';
          benefitClass = 'benefit-sale';
          priceText = '실거래 ' + fmtMoney(apt.price);
          const savedFee = Math.round(apt.price * 0.002);
          benefitText = '<span>우리아파트 수수료 50% 절약</span><span class="benefit-save">➔ ' + savedFee + '만 원 절약</span>';
        } else if (curType === 'jeonse') {
          badgeClass = 'badge-jeonse';
          benefitClass = 'benefit-jeonse';
          priceText = '전세 ' + fmtMoney(apt.price);
          const savedFee = Math.round(apt.price * 0.0015);
          benefitText = '<span>🛡️ HUG 126% 보증보험 안전</span><span class="benefit-save">➔ 수수료 ' + savedFee + '만 원 절약</span>';
        } else {
          badgeClass = 'badge-rent';
          benefitClass = 'benefit-rent';
          priceText = '보증금 ' + apt.price.toLocaleString() + '만 / 월 ' + apt.monthly + '만';
          benefitText = '<span>🔒 최우선변제 100% 전액보호</span><span class="benefit-save">➔ 수수료 17만 원 절약</span>';
        }

        return '<div class="apt-card">' +
          '<div class="apt-name"><span>' + apt.name + ' (' + apt.spec + ')</span><span class="apt-floor">' + apt.floor + '</span></div>' +
          '<div class="price-row"><span class="price-badge ' + badgeClass + '">' + priceText + '</span><span class="price-date">' + apt.date + ' 국토부 신고</span></div>' +
          '<div class="benefit-box ' + benefitClass + '">' + benefitText + '</div>' +
          '</div>';
      }).join('');
    }

    function shareLink() {
      const u = location.href;
      const t = '전남광주통합특별시 안심거래 매칭기';
      const txt = curSido + ' ' + curSigungu + ' ' + curDong + ' 국토부 실거래 아파트 안심거래 매칭기입니다. 수수료 50% 절약 견적도 확인해 보세요.';
      if (navigator.share) {
        navigator.share({ title: t, text: txt, url: u }).catch(() => {});
      } else {
        navigator.clipboard.writeText(u).then(() => {
          alert('안심거래 매칭기 주소가 복사되었습니다! 카카오톡이나 밴드에 붙여넣어 보세요: ' + u);
        }).catch(() => {
          prompt('주소를 복사하세요:', u);
        });
      }
    }

    // Initialize
    initRegionSelects();
    switchMode('sale');
  </script>
</body>
</html>
