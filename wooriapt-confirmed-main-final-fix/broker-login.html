<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1165d7">
<title>공인중개사 로그인 | 우리아파트 안심거래</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}
a{text-decoration:none;color:inherit}

.wrap{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:0 14px 50px;
}

.header{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:21px;
  font-weight:900;
  color:#173a59;
}

.logo-mark{font-size:27px}
.logo strong{color:#1165d7;margin-left:3px}

.home{
  padding:10px 13px;
  border:1px solid #c6d5e1;
  border-radius:10px;
  background:#fff;
  color:#34546d;
  font-size:14px;
  font-weight:900;
}

.card{
  background:#fff;
  border:1px solid #dbe5ec;
  border-radius:18px;
  padding:28px 24px;
  box-shadow:0 6px 18px rgba(26,61,88,.06);
}

.badge{
  display:inline-block;
  padding:7px 10px;
  border-radius:999px;
  background:#eaf4ff;
  color:#1165d7;
  font-size:14px;
  font-weight:900;
}

h1{
  margin:14px 0 10px;
  font-size:30px;
  line-height:1.35;
  color:#143b61;
}

.lead{
  margin:0 0 25px;
  color:#30495d;
  font-size:17px;
  line-height:1.75;
}

.info{
  margin-bottom:22px;
  padding:15px;
  border-radius:12px;
  background:#f4f9fd;
  border:1px solid #d4e5f2;
  color:#274b67;
  font-size:16px;
  line-height:1.75;
  font-weight:700;
}

.info strong{
  color:#1165d7;
}

label{
  display:block;
  margin-bottom:9px;
  color:#173e60;
  font-size:17px;
  font-weight:900;
}

.phone-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.prefix{
  flex:none;
  height:54px;
  min-width:66px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #cfdce6;
  border-radius:11px;
  background:#f8fafc;
  color:#35556e;
  font-size:18px;
  font-weight:900;
}

input{
  width:100%;
  height:54px;
  border:1px solid #c9d9e5;
  border-radius:11px;
  padding:0 15px;
  font-size:19px;
  font-weight:800;
  color:#102b41;
  outline:none;
  background:#fff;
}

input:focus{
  border-color:#1165d7;
  box-shadow:0 0 0 3px rgba(17,101,215,.10);
}

.help{
  margin-top:9px;
  color:#5a7082;
  font-size:15px;
  line-height:1.6;
}

button{
  width:100%;
  min-height:58px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:#1165d7;
  color:#fff;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
}

button:active{
  transform:translateY(1px);
}

.msg{
  min-height:24px;
  margin-top:12px;
  text-align:center;
  font-size:15px;
  line-height:1.6;
  font-weight:800;
}

.msg.error{color:#b42318}
.msg.ok{color:#117a46}

.notice{
  margin-top:18px;
  padding:14px;
  border-radius:11px;
  background:#fff8ed;
  border:1px solid #f0dcc0;
  color:#744f25;
  font-size:14px;
  line-height:1.7;
}

.member-info-link{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:50px;
  margin-top:12px;
  border:1px solid #c8d8e4;
  border-radius:11px;
  background:#fff;
  color:#315873;
  font-size:16px;
  font-weight:900;
}

.footer{
  padding:24px 5px 0;
  text-align:center;
  color:#768896;
  font-size:13px;
  line-height:1.7;
}

@media(max-width:520px){
  .card{padding:23px 17px}
  h1{font-size:27px}
  .lead{font-size:16px}
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">
  <a class="logo" href="/">
    <span class="logo-mark">🏠</span>
    <span>우리아파트<strong>안심거래</strong></span>
  </a>

  <a class="home" href="/">메인으로</a>
</header>

<main class="card">

  <span class="badge">공인중개사 전용</span>

  <h1>공인중개사 로그인</h1>

  <p class="lead">
    회원가입 때 등록한 <strong>대표 휴대전화번호</strong>로 로그인합니다.
    별도의 아이디를 기억할 필요가 없습니다.
  </p>

  <div class="info">
    처음 가입한 공인중개사는
    <strong>사업자등록증</strong>과
    <strong>중개사무소 개설등록증</strong>
    확인 및 회원승인 후 이용할 수 있습니다.
  </div>

  <form id="loginForm" novalidate>

    <label for="phone">
      등록 휴대전화번호
    </label>

    <div class="phone-row">

      <div class="prefix">
        010
      </div>

      <input
        id="phone"
        name="phone"
        type="tel"
        inputmode="numeric"
        autocomplete="tel"
        maxlength="8"
        placeholder="12345678"
        aria-label="휴대전화번호 뒤 8자리"
      >

    </div>

    <div class="help">
      예: 010-1234-5678인 경우
      <strong>12345678</strong> 입력
    </div>

    <button
      id="loginBtn"
      type="submit"
    >
      로그인
    </button>

    <div
      id="msg"
      class="msg"
      aria-live="polite"
    ></div>

  </form>

  <div class="notice">
    휴대전화번호가 변경되었거나 회원정보를 변경해야 하는 경우
    <strong>회원정보 변경</strong> 절차를 이용해 주세요.
  </div>

  <a
    class="member-info-link"
    href="/broker-profile.html"
  >
    회원정보 변경 ›
  </a>

</main>

<footer class="footer">
  © 우리아파트 안심거래. All rights reserved.
</footer>

</div>

<script>
(function(){
  "use strict";

  const form =
    document.getElementById("loginForm");

  const phone =
    document.getElementById("phone");

  const msg =
    document.getElementById("msg");


  phone.addEventListener(
    "input",
    function(){

      this.value =
        this.value
          .replace(/\D/g,"")
          .slice(0,8);

    }
  );


  form.addEventListener(
    "submit",
    function(e){

      e.preventDefault();

      msg.className = "msg";

      if(phone.value.length !== 8){

        msg.textContent =
          "휴대전화번호 뒤 8자리를 정확히 입력해 주세요.";

        msg.classList.add("error");

        phone.focus();

        return;
      }

      /*
        기존 회원 DB/서버 로그인 연결부
        기존 구조를 임의로 변경하지 않습니다.
      */

      msg.textContent =
        "회원정보 확인 시스템 연결 후 로그인이 진행됩니다.";

      msg.classList.add("ok");

    }
  );

})();
</script>

</body>
</html>
