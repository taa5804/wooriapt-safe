};

const feePage = `
<h1>수수료 안내</h1>
<p class="intro"><b>매매 · 전세 · 월세 모두 이사 지원 혜택을 제공합니다.</b><br>
단, <b>이사 지원금은 매수자·임차인에게만 지급</b>됩니다.<br>
매도자·임대인에게는 이사 지원금이 지급되지 않습니다.</p>

<h2>매매 수수료 기준</h2>
<table>
<tr><th>거래금액</th><th>수수료율</th><th>한도액</th></tr>
<tr><td>5천만원 이하</td><td>0.6%</td><td>25만원</td></tr>
<tr><td>5천만원~2억원</td><td>0.5%</td><td>80만원</td></tr>
<tr><td>2억원~9억원</td><td>0.4%</td><td>-</td></tr>
<tr><td>9억원~12억원</td><td>0.5%</td><td>-</td></tr>
<tr><td>12억원~15억원</td><td>0.6%</td><td>-</td></tr>
<tr><td>15억원 이상</td><td>0.7%</td><td>-</td></tr>
</table>

<h2>전세 · 월세 수수료 기준</h2>
<table>
<tr><th>거래금액</th><th>수수료율</th><th>한도액</th></tr>
<tr><td>5천만원 이하</td><td>0.5%</td><td>20만원</td></tr>
<tr><td>5천만원~1억원</td><td>0.4%</td><td>30만원</td></tr>
<tr><td>1억원~6억원</td><td>0.3%</td><td>-</td></tr>
<tr><td>6억원~12억원</td><td>0.4%</td><td>-</td></tr>
<tr><td>12억원~15억원</td><td>0.5%</td><td>-</td></tr>
<tr><td>15억원 이상</td><td>0.6%</td><td>-</td></tr>
</table>

<div class="calculator-box">
<h2>내 이사 지원금 계산하기</h2>
<div class="calc-tabs">
  <button class="calc-tab active" data-type="sale">매매</button>
  <button class="calc-tab" data-type="jeonse">전세</button>
  <button class="calc-tab" data-type="monthly">월세</button>
</div>
<div class="calc-inputs" id="calcInputs"></div>
<button class="calc-btn" id="calcBtn">계산하기</button>
<div class="calc-result" id="calcResult">금액을 입력하면 예상 금액을 확인할 수 있습니다.</div>
</div>

<div class="detail-note">
이사 지원금은 매수자·임차인 대상 혜택입니다. 매도자·임대인은 지원 대상이 아닙니다.
</div>`;

const topic = new URLSearchParams(location.search).get("topic") || "broker";
document.getElementById("content").innerHTML = topic === "fee" ? feePage : (pages[topic] || pages.broker);

if(topic === "fee"){
  let type = "sale";
  const inputs = document.getElementById("calcInputs");
  const result = document.getElementById("calcResult");

  function renderInputs(){
    document.querySelectorAll(".calc-tab").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.type === type);
    });

    if(type === "monthly"){
      inputs.innerHTML = `
        <input id="deposit" type="number" placeholder="보증금 입력 (원)">
        <input id="monthlyRent" type="number" placeholder="월세 입력 (원)">
      `;
    }else{
      inputs.innerHTML = `<input id="price" type="number" placeholder="${type==="sale" ? "매매가격" : "전세보증금"} 입력 (원)">`;
    }
  }

  document.querySelectorAll(".calc-tab").forEach(btn => {
    btn.addEventListener("click", ()=>{
      type = btn.dataset.type;
      renderInputs();
    });
  });

  function rateFor(value, isSale){
    if(isSale){
      if(value <= 50000000) return [0.006, 250000];
      if(value <= 200000000) return [0.005, 800000];
      if(value <= 900000000) return [0.004, null];
      if(value <= 1200000000) return [0.005, null];
      if(value <= 1500000000) return [0.006, null];
      return [0.007, null];
    }else{
      if(value <= 50000000) return [0.005, 200000];
      if(value <= 100000000) return [0.004, 300000];
      if(value <= 600000000) return [0.003, null];
      if(value <= 1200000000) return [0.004, null];
      if(value <= 1500000000) return [0.005, null];
      return [0.006, null];
    }
  }

  document.getElementById("calcBtn").addEventListener("click", ()=>{
    let transactionValue = 0;

    if(type === "monthly"){
      const deposit = Number(document.getElementById("deposit").value || 0);
      const monthly = Number(document.getElementById("monthlyRent").value || 0);

      // Correct rule:
      // first: deposit + monthly * 100
      // if that result is under 50,000,000 won, recalculate as deposit + monthly * 70
      const first = deposit + (monthly * 100);
      transactionValue = first < 50000000 ? deposit + (monthly * 70) : first;
    }else{
      transactionValue = Number(document.getElementById("price").value || 0);
    }

    if(!transactionValue){
      result.textContent = "금액을 입력해 주세요.";
      return;
    }

    const [rate, cap] = rateFor(transactionValue, type === "sale");
    let fee = transactionValue * rate;
    if(cap !== null) fee = Math.min(fee, cap);

    const support = fee / 2;
    result.innerHTML =
      `<b>적용 수수료율</b> ${(rate*100).toFixed(1)}%<br>` +
      `<b>예상 중개수수료</b> ${Math.round(fee).toLocaleString()}원<br>` +
      `<b style="color:#6f43b0">🎁 ${type==="sale"?"매수자":"임차인"} 예상 이사 지원금 ${Math.round(support).toLocaleString()}원</b>`;
  });

  renderInputs();
}
</script>
