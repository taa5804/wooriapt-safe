<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1165d7">

<title>통합관리 | 우리아파트 안심거래</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:100%;
  max-width:680px;
  margin:0 auto;
  padding:20px 14px 50px;
}

.header{
  margin-bottom:20px;
}

.brand{
  font-size:21px;
  font-weight:900;
  color:#173a59;
}

.brand strong{
  color:#1165d7;
}

.card{
  background:#fff;
  border:1px solid #dbe5ec;
  border-radius:18px;
  padding:25px 20px;
  box-shadow:0 6px 18px rgba(26,61,88,.06);
}

h1{
  margin:0 0 8px;
  font-size:27px;
  color:#143b61;
}

.desc{
  margin:0 0 23px;
  color:#657b8b;
  line-height:1.6;
}

.menu{
  display:grid;
  gap:12px;
}

.menu a{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:72px;
  padding:16px 18px;
  background:#fff;
  border:1px solid #d7e3ec;
  border-radius:14px;
}

.menu a:hover{
  border-color:#1165d7;
  background:#f6faff;
}

.menu-title{
  font-size:18px;
  font-weight:900;
  color:#173e60;
}

.menu-desc{
  display:block;
  margin-top:4px;
  font-size:13px;
  font-weight:600;
  color:#718596;
}

.arrow{
  font-size:24px;
  font-weight:900;
  color:#1165d7;
}

.logout{
  display:block;
  width:100%;
  margin-top:20px;
  padding:13px;
  border:1px solid #ccd8e1;
  border-radius:11px;
  background:#fff;
  text-align:center;
  font-weight:800;
  color:#526b7d;
}
</style>
</head>

<body>

<div class="wrap">

  <header class="header">
    <a class="brand" href="/">
      🏠 우리아파트 <strong>안심거래</strong>
    </a>
  </header>


  <main class="card">

    <h1>통합관리</h1>

    <p class="desc">
      이용할 메뉴를 선택하세요.
    </p>


    <div class="menu">

      <!-- 공인중개사 -->
      <a href="/broker-profile.html">

        <div>
          <span class="menu-title">
            공인중개사
          </span>

          <span class="menu-desc">
            공인중개사 회원정보 및 업무
          </span>
        </div>

        <span class="arrow">›</span>

      </a>


      <!-- 나의 제안 -->
      <a href="/broker-proposals.html">

        <div>
          <span class="menu-title">
            나의 제안
          </span>

          <span class="menu-desc">
            제안 및 진행현황 확인
          </span>
        </div>

        <span class="arrow">›</span>

      </a>


      <!-- 본사 관리자 -->
      <a href="/admin-dashboard.html">

        <div>
          <span class="menu-title">
            본사 관리자
          </span>

          <span class="menu-desc">
            회원·거래·시스템 관리
          </span>
        </div>

        <span class="arrow">›</span>

      </a>

    </div>


    <a class="logout" href="/">
      메인으로
    </a>

  </main>

</div>

</body>
</html>
