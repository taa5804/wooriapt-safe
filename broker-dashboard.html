<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1165d7">
<title>공인중개사 업무 | 우리아파트 안심거래</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:18px 14px 50px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.brand{
  font-size:21px;
  font-weight:900;
  color:#173a59;
}

.brand strong{
  color:#1165d7;
}

.home{
  padding:9px 12px;
  border:1px solid #d4dfe7;
  border-radius:10px;
  background:#fff;
  font-size:14px;
  font-weight:800;
  color:#476377;
}

.main-card{
  background:#fff;
  border:1px solid #dce5ec;
  border-radius:18px;
  padding:22px 18px;
  box-shadow:0 6px 18px rgba(26,61,88,.06);
}

.badge{
  display:inline-block;
  padding:6px 10px;
  margin-bottom:10px;
  border-radius:999px;
  background:#eaf4ff;
  color:#1165d7;
  font-size:13px;
  font-weight:900;
}

h1{
  margin:0 0 7px;
  font-size:28px;
  color:#143b61;
}

.desc{
  margin:0 0 22px;
  color:#697e8e;
  font-size:15px;
  line-height:1.6;
}

.menu{
  display:grid;
  gap:12px;
}

.menu-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:82px;
  padding:15px 17px;
  border-radius:14px;
  background:#fff;
  border:1px solid #dde6ec;
  transition:.15s ease;
}

.menu-card:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 15px rgba(26,61,88,.08);
}

.left{
  display:flex;
  align-items:center;
  gap:13px;
}

.icon{
  width:46px;
  height:46px;
  flex:0 0 46px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  font-size:22px;
}

.text strong{
  display:block;
  margin-bottom:4px;
  font-size:18px;
  color:#173e60;
}

.text span{
  display:block;
  font-size:13px;
  color:#728694;
  line-height:1.4;
}

.arrow{
  font-size:25px;
  font-weight:900;
}

.blue{
  border-left:5px solid #1165d7;
}

.blue .icon{
  background:#e8f2ff;
}

.blue .arrow{
  color:#1165d7;
}

.green{
  border-left:5px solid #1c9b74;
}

.green .icon{
  background:#e7f7f1;
}

.green .arrow{
  color:#1c9b74;
}

.orange{
  border-left:5px solid #ef8c24;
}

.orange .icon{
  background:#fff1df;
}

.orange .arrow{
  color:#ef8c24;
}

.purple{
  border-left:5px solid #7657c8;
}

.purple .icon{
  background:#f0ebff;
}

.purple .arrow{
  color:#7657c8;
}

.navy{
  border-left:5px solid #476779;
}

.navy .icon{
  background:#edf2f5;
}

.navy .arrow{
  color:#476779;
}

.footer{
  margin-top:20px;
  text-align:center;
  font-size:12px;
  color:#83939e;
}

@media(max-width:480px){

  .main-card{
    padding:19px 14px;
  }

  h1{
    font-size:25px;
  }

  .menu-card{
    min-height:78px;
    padding:14px;
  }

  .text strong{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">

  <a class="brand" href="/">
    🏠 우리아파트 <strong>안심거래</strong>
  </a>

  <a class="home" href="/">
    메인으로
  </a>

</header>


<main class="main-card">

  <span class="badge">
    공인중개사 전용
  </span>

  <h1>
    공인중개사 업무
  </h1>

  <p class="desc">
    제안부터 거래 진행현황까지 한 곳에서 관리합니다.
  </p>


  <div class="menu">

    <!-- 나의 제안 -->
    <a class="menu-card blue"
       href="/broker-proposals.html">

      <div class="left">

        <div class="icon">
          📋
        </div>

        <div class="text">

          <strong>
            나의 제안
          </strong>

          <span>
            내가 등록한 제안과 진행상태 확인
          </span>

        </div>

      </div>

      <span class="arrow">›</span>

    </a>


    <!-- 매수 임차 요청 -->
    <a class="menu-card green"
       href="/broker-requests.html">

      <div class="left">

        <div class="icon">
          🔎
        </div>

        <div class="text">

          <strong>
            매수·임차 요청
          </strong>

          <span>
            매매·전세·월세 희망조건 확인
          </span>

        </div>

      </div>

      <span class="arrow">›</span>

    </a>


    <!-- 제안 등록 -->
    <a class="menu-card orange"
       href="/broker-offer.html">

      <div class="left">

        <div class="icon">
          🏠
        </div>

        <div class="text">

          <strong>
            제안 등록
          </strong>

          <span>
            조건에 맞는 매물 제안 등록
          </span>

        </div>

      </div>

      <span class="arrow">›</span>

    </a>


    <!-- 거래 진행현황 -->
    <a class="menu-card purple"
       href="/broker-transactions.html">

      <div class="left">

        <div class="icon">
          🤝
        </div>

        <div class="text">

          <strong>
            거래 진행현황
          </strong>

          <span>
            계약 진행중 및 거래완료 확인
          </span>

        </div>

      </div>

      <span class="arrow">›</span>

    </a>


    <!-- 회원정보 변경 -->
    <a class="menu-card navy"
       href="/broker-profile.html">

      <div class="left">

        <div class="icon">
          👤
        </div>

        <div class="text">

          <strong>
            회원정보 변경
          </strong>

          <span>
            중개사무소 및 회원정보 확인·수정
          </span>

        </div>

      </div>

      <span class="arrow">›</span>

    </a>

  </div>

</main>


<div class="footer">
  © 우리아파트 안심거래
</div>

</div>

</body>
</html>
