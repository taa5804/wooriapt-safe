<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173a59">
<title>본사 관리자 로그인 | 우리아파트 안심거래</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}

body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}

a{color:inherit;text-decoration:none}

.wrap{
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:28px 14px 50px;
}

.header{margin-bottom:20px}

.brand{
  font-size:21px;
  font-weight:900;
  color:#173a59;
}

.brand strong{color:#1165d7}

.card{
  background:#fff;
  border:1px solid #dbe5ec;
  border-top:5px solid #173a59;
  border-radius:18px;
  padding:27px 21px;
  box-shadow:0 6px 18px rgba(26,61,88,.07);
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:#e9eef2;
  color:#173a59;
  font-size:13px;
  font-weight:900;
}

h1{
  margin:13px 0 7px;
  font-size:28px;
  color:#143b61;
}

.desc{
  margin:0 0 23px;
  color:#697e8e;
  font-size:14px;
}

.field{margin-bottom:15px}

label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:900;
  color:#34546d;
}

input{
  width:100%;
  height:48px;
  padding:0 13px;
  border:1px solid #cbd8e2;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

input:focus{border-color:#1165d7}

.login-btn{
  width:100%;
  height:50px;
  margin-top:5px;
  border:0;
  border-radius:10px;
  background:#173a59;
  color:#fff;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.login-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.msg{
  min-height:22px;
  margin-top:13px;
  text-align:center;
  font-size:14px;
  font-weight:800;
}

.error{color:#c33b32}
.ok{color:#168560}

.home{
  display:block;
  margin-top:17px;
  text-align:center;
  color:#617889;
  font-size:14px;
  font-weight:800;
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">
<a class="brand" href="/">
🏠 우리아파트 <strong>안심거래</strong>
</a>
</header>

<main class="card">

<span class="badge">본사 전용</span>

<h1>관리자 로그인</h1>

<p class="desc">
등록된 본사 관리자만 이용할 수 있습니다.
</p>

<form id="adminLoginForm">

<div class="field">
<label for="adminId">관리자 이메일</label>

<input
id="adminId"
type="email"
autocomplete="username"
placeholder="관리자 이메일"
required>
</div>

<div class="field">
<label for="adminPassword">비밀번호</label>

<input
id="adminPassword"
type="password"
autocomplete="current-password"
placeholder="비밀번호"
required>
</div>

<button
id="loginBtn"
class="login-btn"
type="submit">
관리자 로그인
</button>

<div id="msg" class="msg"></div>

</form>

<a class="home" href="/">
메인으로 돌아가기
</a>

</main>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function(){

"use strict";

const SUPABASE_URL =
"https://wpshlmijsscmlasqtapa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3QLYewR-TXBd1mNfte6OJg_kre42L7K";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form =
document.getElementById("adminLoginForm");

const email =
document.getElementById("adminId");

const password =
document.getElementById("adminPassword");

const msg =
document.getElementById("msg");

const loginBtn =
document.getElementById("loginBtn");


form.addEventListener(
"submit",
async function(e){

e.preventDefault();

msg.className = "msg";
msg.textContent = "";

loginBtn.disabled = true;
loginBtn.textContent = "확인 중...";


try{

const result =
await sb.auth.signInWithPassword({
  email: email.value.trim(),
  password: password.value
});


if(result.error){
  throw result.error;
}


const user =
result.data.user;


const adminResult =
await sb
.from("admin_users")
.select("id,user_id,admin_name,role,is_active")
.eq("user_id",user.id)
.eq("is_active",true)
.maybeSingle();


if(adminResult.error){

  await sb.auth.signOut();

  throw adminResult.error;
}


if(!adminResult.data){

  await sb.auth.signOut();

  msg.className = "msg error";

  msg.textContent =
  "본사 관리자 권한이 없는 계정입니다.";

  return;
}


msg.className = "msg ok";

msg.textContent =
"관리자 확인이 완료되었습니다.";


setTimeout(function(){

location.replace(
"/admin-dashboard.html"
);

},300);


}catch(err){

console.error(err);

msg.className = "msg error";

if(
  err.message &&
  err.message.toLowerCase().includes("email not confirmed")
){

  msg.textContent =
  "관리자 이메일 확인이 완료되지 않았습니다.";

}else if(
  err.message &&
  err.message.toLowerCase().includes("invalid login")
){

  msg.textContent =
  "이메일 또는 비밀번호가 맞지 않습니다.";

}else{

  msg.textContent =
  "관리자 로그인에 실패했습니다.";

}

}finally{

loginBtn.disabled = false;

loginBtn.textContent =
"관리자 로그인";

}

}
);

})();
</script>

</body>
</html>
