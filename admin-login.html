<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173a59">

<title>본사 관리자 로그인 | 우리아파트 안심거래</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:28px 14px 50px;
}

.header{
  margin-bottom:20px;
}

.brand{
  font-size:21px;
  font-weight:900;
  color:#173a59;
}

.brand strong{
  color:#1165d7;
}

.card{
  background:#fff;
  border:1px solid #dbe5ec;
  border-top:5px solid #173a59;
  border-radius:18px;
  padding:27px 21px;
  box-shadow:0 6px 18px rgba(26,61,88,.07);
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:#e9eef2;
  color:#173a59;
  font-size:13px;
  font-weight:900;
}

h1{
  margin:13px 0 7px;
  font-size:28px;
  color:#143b61;
}

.desc{
  margin:0 0 23px;
  color:#697e8e;
  font-size:14px;
  line-height:1.6;
}

.field{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:900;
  color:#34546d;
}

input{
  width:100%;
  height:48px;
  padding:0 13px;
  border:1px solid #cbd8e2;
  border-radius:10px;
  background:#fff;
  font-size:17px;
  outline:none;
}

input:focus{
  border-color:#1165d7;
}

.login-btn{
  width:100%;
  height:50px;
  margin-top:5px;
  border:0;
  border-radius:10px;
  background:#173a59;
  color:#fff;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.msg{
  min-height:22px;
  margin-top:13px;
  text-align:center;
  font-size:14px;
  font-weight:800;
}

.error{
  color:#c33b32;
}

.home{
  display:block;
  margin-top:16px;
  text-align:center;
  color:#617889;
  font-size:14px;
  font-weight:800;
}

.notice{
  margin-top:22px;
  padding:13px;
  border-radius:10px;
  background:#f5f7f9;
  color:#70818d;
  font-size:12px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="wrap">

<header class="header">
  <a class="brand" href="/">
    🏠 우리아파트 <strong>안심거래</strong>
  </a>
</header>

<main class="card">

  <span class="badge">본사 전용</span>

  <h1>관리자 로그인</h1>

  <p class="desc">
    본사 관리자만 이용할 수 있습니다.
  </p>

  <form id="adminLoginForm">

    <div class="field">
      <label for="adminId">관리자 아이디</label>
      <input
        id="adminId"
        type="text"
        autocomplete="username"
        required>
    </div>

    <div class="field">
      <label for="adminPassword">비밀번호</label>
      <input
        id="adminPassword"
        type="password"
        autocomplete="current-password"
        required>
    </div>

    <button class="login-btn" type="submit">
      관리자 로그인
    </button>

    <div id="msg" class="msg"></div>

  </form>

  <div class="notice">
    관리자 계정은 일반 공인중개사 계정과 분리하여 관리합니다.
  </div>

  <a class="home" href="/">
    메인으로 돌아가기
  </a>

</main>

</div>

<script>
(function(){

"use strict";

const form =
  document.getElementById("adminLoginForm");

const msg =
  document.getElementById("msg");

form.addEventListener("submit",function(e){

  e.preventDefault();

  msg.className = "msg error";

  msg.textContent =
    "관리자 인증 시스템 연결 후 로그인이 가능합니다.";

});

})();
</script>

</body>
</html>
