<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(async function(){

"use strict";

const SUPABASE_URL =
"https://wpshlmijsscmlasqtapa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3QLYewR-TXBd1mNfte6OJg_kre42L7K";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function denyAccess(){

await sb.auth.signOut();

location.replace(
"/admin-login.html"
);

}


try{

const sessionResult =
await sb.auth.getSession();


if(
  sessionResult.error ||
  !sessionResult.data.session
){

  location.replace(
  "/admin-login.html"
  );

  return;
}


const user =
sessionResult.data.session.user;


const adminResult =
await sb
.from("admin_users")
.select("id,role,is_active")
.eq("user_id",user.id)
.eq("is_active",true)
.maybeSingle();


if(
  adminResult.error ||
  !adminResult.data
){

  await denyAccess();

  return;
}


/*
  관리자 확인 완료 후에만
  화면을 표시합니다.
*/

document.body.style.display =
"block";


}catch(err){

console.error(err);

await denyAccess();

}


document
.getElementById("logoutBtn")
.addEventListener(
"click",
async function(){

await sb.auth.signOut();

location.replace(
"/admin-login.html"
);

}
);

})();
</script>
