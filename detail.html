<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상세안내</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="detail-page">
<div class="detail-wrap">
  <a class="back-link" href="/">← 메인화면</a>
  <div class="detail-card" id="content"></div>
</div>

<script>
const pages = {
broker: `
<h1>검증된 공인중개사</h1>
<p class="intro"><b>안심하고 거래할 수 있도록<br>공인중개사 정보를 확인합니다.</b></p>

<h2>① 공인중개사 자격 확인</h2>
<p>고객에게 매물을 제안하고 거래를 진행하는 중개사가 정식 공인중개사인지 확인합니다.</p>

<h2>② 중개사무소 정보 확인</h2>
<p>실제로 운영되는 중개사무소의 기본 정보를 확인하여 고객이 안심하고 상담할 수 있도록 합니다.</p>

<h2>③ 제안한 공인중개사 정보 확인</h2>
<p>매물 제안을 받으면 어떤 공인중개사가 제안했는지 고객이 확인할 수 있도록 합니다.</p>

<h2>④ 고객이 직접 선택</h2>
<p>제안받은 매물과 조건을 비교한 후 원하는 공인중개사와 매물을 고객이 직접 선택합니다.</p>

<h2>⑤ 거래 단계까지 안전하게 연결</h2>
<p>선택한 공인중개사와 거래를 진행하고 이후 전자계약, 선택형 에스크로 등 안심거래 절차로 연결됩니다.</p>`,

contract: `
<h1>전자계약</h1>
<p class="intro"><b>계약은 간편하게, 신고와 보관까지 편리하게</b></p>
<p>종이계약서 대신 전자계약을 이용하면 계약 체결뿐 아니라 계약 이후 필요한 행정절차까지 보다 편리하게 처리할 수 있습니다.</p>

<h2>① 종이계약서 없이 편리하게</h2>
<p>계약 내용을 확인하고 본인인증 후 전자서명으로 계약을 진행합니다. 종이계약서를 여러 장 작성하고 보관해야 하는 불편을 줄일 수 있습니다.</p>

<h2>② 매매 실거래신고 자동 신청</h2>
<p>매매 전자계약이 확정되면 <b>부동산 실거래신고가 자동으로 신청</b>되고 신고필증도 자동 발급됩니다. 별도로 실거래신고를 해야 하는 번거로움을 줄일 수 있습니다.</p>

<h2>③ 전·월세 확정일자·임대차신고 안내</h2>
<p>주택 임대차계약 완료 후 필요한 <b>임대차신고와 확정일자 관련 절차를 안내</b>합니다.</p>

<h2>④ 계약서 안전 보관</h2>
<p>완료된 전자계약서는 <b>공인된 전자문서센터에 보관</b>되어 계약서를 분실할 걱정을 줄이고 필요할 때 조회·열람할 수 있습니다.</p>

<h2>⑤ 계약 이후 절차까지 연결</h2>
<p>전자계약 시스템은 금융서비스와 등기서비스 등 계약 이후 필요한 서비스와 연계할 수 있도록 구성되어 있습니다.</p>`,

escrow: `
<h1>선택형 에스크로</h1>
<p class="intro"><b>에스크로 이용을 원하는 경우 우리은행 부동산에스크로이체를 안내합니다.</b></p>

<p>에스크로는 필수 서비스가 아니며 거래당사자가 필요한 경우 선택하여 이용할 수 있습니다.</p>

<h2>① 에스크로 이용 여부 선택</h2>
<p>거래당사자가 에스크로 이용을 원하는 경우 <b>에스크로 이용</b>을 선택합니다.</p>

<h2>② 우리은행 부동산에스크로이체 안내</h2>
<p>에스크로 이용을 선택하면 <b>우리은행 부동산에스크로이체</b> 이용방법을 안내합니다.</p>

<h2>③ 실제 이용은 우리은행에서 진행</h2>
<p>우리아파트 안심거래는 에스크로 금융기관과 이용방법을 안내하며, 실제 에스크로 신청과 이용은 <b>우리은행에서 직접 진행</b>합니다.</p>

<div class="detail-note"><b>에스크로 선택 → 우리은행 부동산에스크로이체 안내</b></div>`,

registry: `
<h1>매매 셀프등기 지원</h1>
<p class="intro"><b>법무사 비용 부담은 줄이고, 소유권이전등기는 직접 할 수 있도록 도와드립니다.</b></p>
<p>아파트 매매가 완료되면 필요한 소유권이전등기를 법무사에게 반드시 맡기는 방식이 아니라, <b>매수자가 직접 진행할 수 있도록 필요한 양식과 절차를 안내</b>합니다. 플랫폼의 셀프등기 지원 수수료는 <b>0원</b>으로 확정한 구조입니다.</p>

<h2>① 셀프등기 절차를 순서대로 안내</h2>
<p>처음 하는 사람도 따라갈 수 있도록 소유권이전등기에 필요한 <b>준비 → 작성 → 신청 → 접수 → 완료 확인</b> 과정을 순서대로 안내합니다.</p>

<h2>② 필요한 서류를 한눈에 확인</h2>
<p>매수자와 매도자가 준비해야 할 서류를 체크리스트로 제공하여 어떤 서류가 필요한지 쉽게 확인할 수 있도록 합니다. 확정 로직에도 체크리스트·양식·작성예시를 제공하도록 되어 있습니다.</p>

<h2>③ 작성 양식과 예시 제공</h2>
<p>등기신청에 필요한 <b>양식·작성방법·작성예시</b>를 제공하여 이용자가 직접 작성하고 신청할 수 있도록 지원합니다.</p>

<h2>④ 진행상태를 단계별로 확인</h2>
<p>서류 준비부터 등기 접수, 소유권이전 완료까지 진행단계를 확인할 수 있도록 하여 현재 어디까지 진행됐는지 쉽게 알 수 있게 합니다.</p>

<h2>⑤ 셀프등기 지원 수수료 0원</h2>
<p>우리아파트 안심거래에서 제공하는 <b>셀프등기 안내·양식·체크리스트·작성예시 등의 지원 수수료는 0원</b>입니다. 다만 취득세, 국민주택채권, 등기신청수수료 등 <b>법정·외부 실비는 이용자가 부담</b>합니다.</p>`
};


const feePage = `
<h1>플랫폼 이용료 안내</h1>

<p class="intro">
<b>거래금액을 직접 입력하여 매수인·매도인 또는 임차인·임대인의 예상 비용을 확인할 수 있습니다.</b><br>
화면에 표시되는 금액은 부가세가 포함된 예상 금액입니다.
</p>

<div class="calculator-box">

<h2>거래당사자 예상 비용 확인</h2>

<div class="calc-tabs">
  <button class="calc-tab active" data-type="sale">매매</button>
  <button class="calc-tab" data-type="jeonse">전세</button>
  <button class="calc-tab" data-type="monthly">월세</button>
</div>

<div class="calc-inputs" id="calcInputs"></div>

<button class="calc-btn" id="calcBtn">비용 확인하기</button>

<div class="calc-result" id="calcResult">
거래금액을 입력하면 거래당사자의 예상 비용을 확인할 수 있습니다.
</div>

</div>

<div class="detail-note">
<b>※ 표시되는 예상 비용은 부가세가 포함된 금액입니다.</b>
</div>`;


const topic =
new URLSearchParams(location.search).get("topic") || "broker";

document.getElementById("content").innerHTML =
topic === "fee"
? feePage
: (pages[topic] || pages.broker);


if(topic === "fee"){

  let type = "sale";

  const inputs =
  document.getElementById("calcInputs");

  const result =
  document.getElementById("calcResult");


  function renderInputs(){

    document
    .querySelectorAll(".calc-tab")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.type === type
      );

    });


    if(type === "monthly"){

      inputs.innerHTML = `
        <input
          id="deposit"
          type="number"
          placeholder="보증금 입력 (원)"
        >

        <input
          id="monthlyRent"
          type="number"
          placeholder="월세 입력 (원)"
        >
      `;

    }else{

      inputs.innerHTML = `
        <input
          id="price"
          type="number"
          placeholder="${type==="sale" ? "매매가격" : "전세보증금"} 입력 (원)"
        >
      `;

    }

  }


  document
  .querySelectorAll(".calc-tab")
  .forEach(btn => {

    btn.addEventListener(
      "click",
      ()=>{

        type = btn.dataset.type;

        renderInputs();

        result.innerHTML =
          "거래금액을 입력하면 거래당사자의 예상 비용을 확인할 수 있습니다.";

      }
    );

  });


  /*
    내부 비용 계산
    화면에는 요율과 계산식을 표시하지 않습니다.
  */

  function rateFor(value, isSale){

    if(isSale){

      if(value <= 50000000)
        return [0.006,250000];

      if(value <= 200000000)
        return [0.005,800000];

      if(value <= 900000000)
        return [0.004,null];

      if(value <= 1200000000)
        return [0.005,null];

      if(value <= 1500000000)
        return [0.006,null];

      return [0.007,null];

    }else{

      if(value <= 50000000)
        return [0.005,200000];

      if(value <= 100000000)
        return [0.004,300000];

      if(value <= 600000000)
        return [0.003,null];

      if(value <= 1200000000)
        return [0.004,null];

      if(value <= 1500000000)
        return [0.005,null];

      return [0.006,null];

    }

  }


  function calculateBaseFee(value,isSale){

    const [rate,cap] =
      rateFor(value,isSale);

    let fee =
      value * rate;

    if(cap !== null){

      fee =
        Math.min(fee,cap);

    }

    return fee;

  }


  document
  .getElementById("calcBtn")
  .addEventListener(
    "click",
    ()=>{

      let transactionValue = 0;


      if(type === "monthly"){

        const deposit =
          Number(
            document
            .getElementById("deposit")
            .value || 0
          );

        const monthly =
          Number(
            document
            .getElementById("monthlyRent")
            .value || 0
          );


        if(!deposit && !monthly){

          result.textContent =
            "보증금과 월세를 입력해 주세요.";

          return;

        }


        const first =
          deposit + (monthly * 100);

        transactionValue =
          first < 50000000
          ? deposit + (monthly * 70)
          : first;

      }else{

        transactionValue =
          Number(
            document
            .getElementById("price")
            .value || 0
          );

      }


      if(!transactionValue){

        result.textContent =
          "금액을 입력해 주세요.";

        return;

      }


      const baseFee =
        calculateBaseFee(
          transactionValue,
          type === "sale"
        );


      /*
        부가세 포함
      */

      const vatIncludedFee =
        Math.round(
          baseFee * 1.1
        );


      /*
        플랫폼 이용료
        현재 확정 구조에 따라
        중개보수 상당액 + 부가세
      */

      const platformFee =
        vatIncludedFee;


      if(type === "sale"){

        result.innerHTML = `

          <div style="margin-bottom:16px">

            <b>매수인 예상 비용</b><br>

            플랫폼 이용료
            (부가세 포함)
            <b>
            ${platformFee.toLocaleString()}원
            </b><br>

            공인중개사 중개보수
            <b>0원</b>

          </div>


          <div>

            <b>매도인 예상 비용</b><br>

            공인중개사 중개보수
            (부가세 포함)
            <b>
            ${vatIncludedFee.toLocaleString()}원
            </b><br>

            플랫폼 이용료
            <b>0원</b>

          </div>

        `;

      }else{

        result.innerHTML = `

          <div style="margin-bottom:16px">

            <b>임차인 예상 비용</b><br>

            플랫폼 이용료
            (부가세 포함)
            <b>
            ${platformFee.toLocaleString()}원
            </b><br>

            공인중개사 중개보수
            <b>0원</b>

          </div>


          <div>

            <b>임대인 예상 비용</b><br>

            공인중개사 중개보수
            (부가세 포함)
            <b>
            ${vatIncludedFee.toLocaleString()}원
            </b><br>

            플랫폼 이용료
            <b>0원</b>

          </div>

        `;

      }

    }
  );


  renderInputs();

}

</script>

</body>
</html>
