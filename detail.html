<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상세안내</title>

<link rel="stylesheet" href="/assets/style.css">

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body.detail-page{
  background:#f5f7fb;
  color:#172b3d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    Arial,
    sans-serif;
}

.detail-wrap{
  width:100%;
  max-width:980px;
  margin:0 auto;
  padding:20px 16px 60px;
}

.back-link{
  display:inline-block;
  margin-bottom:18px;
  color:#245a91;
  font-size:15px;
  font-weight:800;
  text-decoration:none;
}

.detail-card{
  background:#fff;
  border:1px solid #e1e8ef;
  border-radius:18px;
  padding:28px;
  box-shadow:0 7px 24px rgba(31,65,92,.07);
}

.detail-card h1{
  margin:0 0 20px;
  color:#152b49;
  font-size:32px;
  line-height:1.35;
  font-weight:900;
}

.detail-card h2{
  margin:28px 0 10px;
  color:#173f67;
  font-size:21px;
  line-height:1.5;
}

.detail-card p{
  margin:0 0 12px;
  color:#34495c;
  font-size:16px;
  line-height:1.8;
}

.detail-card .intro{
  margin-bottom:22px;
  color:#263e54;
  font-size:17px;
  line-height:1.8;
}

.detail-note{
  margin-top:24px;
  padding:16px;
  border-radius:12px;
  background:#f4f8fc;
  color:#38536c;
  font-size:15px;
  line-height:1.8;
}


/* =========================================
   플랫폼 이용료 안내
========================================= */

.fee-page{
  margin:-28px;
  padding:28px;
  border-radius:18px;
  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #fbfdff 100%
    );
}

.fee-title{
  margin:0 0 20px;
  color:#102847;
  font-size:34px;
  font-weight:900;
  letter-spacing:-1px;
}

.fee-info{
  padding:22px;
  border:1px solid #a8d0ff;
  border-radius:16px;
  background:
    linear-gradient(
      135deg,
      #f3f9ff 0%,
      #eef7ff 100%
    );
}

.fee-info-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
  color:#153f70;
  font-size:18px;
  font-weight:900;
}

.info-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:34px;
  height:34px;
  border-radius:50%;
  border:2px solid #1670dc;
  color:#1670dc;
  font-size:19px;
  font-weight:900;
  background:#fff;
}

.fee-info p{
  margin:7px 0;
  color:#22384d;
  font-size:15px;
  line-height:1.75;
}

.fee-info strong{
  color:#075dbf;
}

.info-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
}

.info-box{
  padding:14px 15px;
  border-radius:12px;
  background:#fff;
  border:1px solid #dce8f4;
  color:#34495c;
  font-size:14px;
  line-height:1.7;
}

.info-box.blue{
  border-left:4px solid #1670dc;
}

.info-box.green{
  border-left:4px solid #34a853;
}

.info-box.blue strong{
  color:#1262c0;
}

.info-box.green strong{
  color:#23853b;
}

.fee-small-notice{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  margin-top:16px;
  padding-top:15px;
  border-top:1px solid #d4e4f4;
  color:#40556b;
  font-size:13px;
  font-weight:700;
}

.calculator-box{
  margin-top:28px;
}

.calc-heading{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 16px;
  color:#172b3d;
  font-size:24px;
  font-weight:900;
}

.calc-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  border-radius:8px;
  background:#173f67;
  color:#fff;
  font-size:18px;
}

.calc-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:18px;
}

.calc-tab{
  height:52px;
  border:1px solid #cad7e3;
  border-radius:10px;
  background:#fff;
  color:#29445f;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.calc-tab.active{
  border-color:#1165d7;
  background:
    linear-gradient(
      135deg,
      #1165d7 0%,
      #2582ed 100%
    );
  color:#fff;
  box-shadow:0 5px 14px rgba(17,101,215,.18);
}

.calc-inputs{
  margin-top:8px;
}

.field-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.field-group{
  min-width:0;
}

.field-group.full{
  grid-column:1 / -1;
}

.field-label{
  display:block;
  margin-bottom:7px;
  color:#263d52;
  font-size:14px;
  font-weight:900;
}

.input-money-wrap{
  position:relative;
}

.input-money-wrap input{
  width:100%;
  height:50px;
  padding:0 50px 0 14px;
  border:1px solid #bfcddd;
  border-radius:9px;
  background:#fff;
  color:#172b3d;
  font-size:17px;
  font-weight:800;
  outline:none;
}

.input-money-wrap input:focus{
  border-color:#1165d7;
  box-shadow:0 0 0 3px rgba(17,101,215,.10);
}

.input-unit{
  position:absolute;
  top:50%;
  right:15px;
  transform:translateY(-50%);
  color:#617487;
  font-size:14px;
  font-weight:800;
}

.calc-btn-wrap{
  text-align:center;
  margin-top:20px;
}

.calc-btn{
  width:100%;
  max-width:310px;
  height:52px;
  border:0;
  border-radius:10px;
  background:
    linear-gradient(
      135deg,
      #1165d7 0%,
      #1e7be8 100%
    );
  color:#fff;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 6px 16px rgba(17,101,215,.20);
}

.calc-btn:hover{
  filter:brightness(.97);
}

.calc-result{
  margin-top:26px;
}

.result-empty{
  padding:20px;
  border:1px dashed #b9c8d7;
  border-radius:12px;
  background:#fafcfe;
  color:#67798a;
  font-size:15px;
  text-align:center;
}

.result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.result-card{
  overflow:hidden;
  border-radius:15px;
  background:#fff;
}

.result-card.buyer{
  border:1px solid #b9d8fa;
  box-shadow:0 5px 18px rgba(17,101,215,.08);
}

.result-card.seller{
  border:1px solid #bfe2c6;
  box-shadow:0 5px 18px rgba(52,168,83,.08);
}

.result-head{
  padding:15px;
  text-align:center;
  font-size:19px;
  font-weight:900;
}

.result-card.buyer .result-head{
  background:#edf6ff;
  color:#1262c0;
}

.result-card.seller .result-head{
  background:#f0faef;
  color:#23853b;
}

.result-sub{
  margin:0 14px 12px;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-size:13px;
  font-weight:800;
}

.result-card.buyer .result-sub{
  background:#f2f8ff;
  color:#235f9f;
}

.result-card.seller .result-sub{
  background:#f3fbf1;
  color:#387d42;
}

.result-body{
  margin:0 14px 14px;
  border:1px solid #e0e6eb;
  border-radius:10px;
  overflow:hidden;
}

.result-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:58px;
  padding:12px 14px;
  border-bottom:1px dashed #d8e0e7;
}

.result-line:last-child{
  border-bottom:0;
}

.result-label{
  color:#26394c;
  font-size:14px;
  line-height:1.5;
  font-weight:800;
}

.result-value{
  flex:none;
  color:#172b3d;
  font-size:18px;
  font-weight:900;
}

.result-card.buyer .main-value{
  color:#1165d7;
}

.result-card.seller .main-value{
  color:#24953d;
}

.result-total{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 14px 14px;
  padding:14px;
  border-radius:10px;
  font-weight:900;
}

.result-card.buyer .result-total{
  background:#e9f4ff;
  color:#1165d7;
}

.result-card.seller .result-total{
  background:#eaf8e7;
  color:#23853b;
}

.result-total strong{
  font-size:21px;
}

.bottom-notice{
  display:flex;
  gap:12px;
  margin-top:22px;
  padding:18px;
  border:1px solid #f2d18a;
  border-radius:14px;
  background:#fff9ec;
}

.warning-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#f7b928;
  color:#fff;
  font-size:20px;
  font-weight:900;
}

.bottom-notice-text{
  color:#4a4333;
  font-size:14px;
  line-height:1.9;
  font-weight:700;
}


/* =========================================
   모바일
========================================= */

@media(max-width:700px){

  .detail-wrap{
    padding:12px 10px 40px;
  }

  .detail-card{
    padding:18px 14px;
    border-radius:14px;
  }

  .fee-page{
    margin:-18px -14px;
    padding:20px 14px;
  }

  .fee-title{
    font-size:28px;
  }

  .info-row{
    grid-template-columns:1fr;
  }

  .fee-small-notice{
    display:block;
  }

  .fee-small-notice div{
    margin-top:6px;
  }

  .field-grid{
    grid-template-columns:1fr;
  }

  .field-group.full{
    grid-column:auto;
  }

  .result-grid{
    grid-template-columns:1fr;
  }

  .calc-tab{
    height:48px;
    font-size:15px;
  }

  .result-line{
    padding:11px;
  }

  .result-value{
    font-size:16px;
  }

}
</style>
</head>

<body class="detail-page">

<div class="detail-wrap">

<a class="back-link" href="/">← 메인화면</a>

<div class="detail-card" id="content"></div>

<div class="info-row">

<div class="calculator-box">

const topic =
new URLSearchParams(
  location.search
).get("topic") || "broker";


document
.getElementById("content")
.innerHTML =
topic === "fee"
  ? feePage
  : (pages[topic] || pages.broker);



if(topic === "fee"){

  let type = "sale";

  const inputs =
  document.getElementById(
    "calcInputs"
  );

  const result =
  document.getElementById(
    "calcResult"
  );


  function formatInputNumber(input){

    const raw =
    input.value.replace(
      /[^0-9]/g,
      ""
    );

    if(!raw){

      input.value = "";
      return;

    }

    input.value =
    Number(raw).toLocaleString();

  }


  function numberValue(id){

    const el =
    document.getElementById(id);

    if(!el){
      return 0;
    }

    return Number(
      String(el.value || "")
      .replace(/,/g,"")
      .replace(/[^0-9]/g,"")
    );

  }


  function bindMoneyInputs(){

    document
    .querySelectorAll(
      ".money-input"
    )
    .forEach(input => {

      input.addEventListener(
        "input",
        function(){

          formatInputNumber(this);

        }
      );

    });

  }


  function renderInputs(){

    document
    .querySelectorAll(
      ".calc-tab"
    )
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.type === type
      );

    });


    if(type === "sale"){

      inputs.innerHTML = `

      <div class="field-grid">

        <div class="field-group full">

          <label class="field-label">
          거래금액(매매가)
          </label>

          <div class="input-money-wrap">

            <input
            id="price"
            class="money-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="매매가격을 입력하세요"
            >

            <span class="input-unit">
            원
            </span>

          </div>

        </div>

      </div>

      `;

    }


    if(type === "jeonse"){

      inputs.innerHTML = `

      <div class="field-grid">

        <div class="field-group full">

          <label class="field-label">
          전세보증금
          </label>

          <div class="input-money-wrap">

            <input
            id="price"
            class="money-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="전세보증금을 입력하세요"
            >

            <span class="input-unit">
            원
            </span>

          </div>

        </div>

      </div>

      `;

    }


    if(type === "monthly"){

      inputs.innerHTML = `

      <div class="field-grid">

        <div class="field-group">

          <label class="field-label">
          보증금
          </label>

          <div class="input-money-wrap">

            <input
            id="deposit"
            class="money-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="보증금 입력"
            >

            <span class="input-unit">
            원
            </span>

          </div>

        </div>


        <div class="field-group">

          <label class="field-label">
          월세
          </label>

          <div class="input-money-wrap">

            <input
            id="monthlyRent"
            class="money-input"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="월세 입력"
            >

            <span class="input-unit">
            원
            </span>

          </div>

        </div>

      </div>

      `;

    }


    result.innerHTML = `

    <div class="result-empty">
    거래금액을 입력한 후 비용 확인하기를 눌러주세요.
    </div>

    `;


    bindMoneyInputs();

  }



  document
  .querySelectorAll(
    ".calc-tab"
  )
  .forEach(btn => {

    btn.addEventListener(
      "click",
      function(){

        type =
        this.dataset.type;

        renderInputs();

      }
    );

  });



  /*
    내부 계산용 중개보수 기준

    화면에는 요율이나 계산식을
    표시하지 않습니다.
  */

  function brokerageBase(
    value,
    isSale
  ){

    let rate = 0;
    let cap = null;


    if(isSale){

      if(value <= 50000000){

        rate = 0.006;
        cap = 250000;

      }else if(
        value <= 200000000
      ){

        rate = 0.005;
        cap = 800000;

      }else if(
        value <= 900000000
      ){

        rate = 0.004;

      }else if(
        value <= 1200000000
      ){

        rate = 0.005;

      }else if(
        value <= 1500000000
      ){

        rate = 0.006;

      }else{

        rate = 0.007;

      }

    }else{

      if(value <= 50000000){

        rate = 0.005;
        cap = 200000;

      }else if(
        value <= 100000000
      ){

        rate = 0.004;
        cap = 300000;

      }else if(
        value <= 600000000
      ){

        rate = 0.003;

      }else if(
        value <= 1200000000
      ){

        rate = 0.004;

      }else if(
        value <= 1500000000
      ){

        rate = 0.005;

      }else{

        rate = 0.006;

      }

    }


    let fee =
    value * rate;


    if(cap !== null){

      fee =
      Math.min(
        fee,
        cap
      );

    }


    return fee;

  }



  function money(value){

    return Math.round(
      value
    ).toLocaleString() + "원";

  }



  document
  .getElementById(
    "calcBtn"
  )
  .addEventListener(
    "click",
    function(){

      let transactionValue = 0;


      if(type === "monthly"){

        const deposit =
        numberValue(
          "deposit"
        );

        const monthly =
        numberValue(
          "monthlyRent"
        );


        if(
          deposit <= 0 &&
          monthly <= 0
        ){

          result.innerHTML = `

          <div class="result-empty">
          보증금 또는 월세 금액을 입력해 주세요.
          </div>

          `;

          return;

        }


        const first =
        deposit +
        (
          monthly * 100
        );


        transactionValue =
        first < 50000000
          ? deposit +
            (
              monthly * 70
            )
          : first;

      }else{

        transactionValue =
        numberValue(
          "price"
        );


        if(
          transactionValue <= 0
        ){

          result.innerHTML = `

          <div class="result-empty">
          거래금액을 입력해 주세요.
          </div>

          `;

          return;

        }

      }



      const baseFee =
      brokerageBase(
        transactionValue,
        type === "sale"
      );


      /*
        부가세 10% 포함
      */

      const sellerBrokerage =
      baseFee * 1.1;


      /*
        매수인·임차인 플랫폼 이용료

        기준 중개보수의 50%
        + 해당 금액의 부가세
      */

      const buyerPlatformFee =
      (
        baseFee * 0.5
      ) * 1.1;



      const buyerName =
      type === "sale"
        ? "매수인"
        : "임차인";


      const sellerName =
      type === "sale"
        ? "매도인"
        : "임대인";



      result.innerHTML = `

      <div class="result-grid">


        <div class="result-card buyer">

          <div class="result-head">
          👤 ${buyerName} 예상 비용
          </div>

          <div class="result-sub">
          ${buyerName}은 공인중개사 중개보수 0원
          </div>

          <div class="result-body">

            <div class="result-line">

              <div class="result-label">
              플랫폼 이용료<br>
              (부가세 포함)
              </div>

              <div class="result-value main-value">
              ${money(buyerPlatformFee)}
              </div>

            </div>


            <div class="result-line">

              <div class="result-label">
              공인중개사 중개보수
              </div>

              <div class="result-value">
              0원
              </div>

            </div>

          </div>


          <div class="result-total">

            <span>
            총 예상 비용<br>
            <small>(부가세 포함)</small>
            </span>

            <strong>
            ${money(buyerPlatformFee)}
            </strong>

          </div>

        </div>



        <div class="result-card seller">

          <div class="result-head">
          👤 ${sellerName} 예상 비용
          </div>

          <div class="result-sub">
          ${sellerName}은 플랫폼 이용료 0원
          </div>

          <div class="result-body">

            <div class="result-line">

              <div class="result-label">
              공인중개사 중개보수<br>
              (부가세 포함)
              </div>

              <div class="result-value main-value">
              ${money(sellerBrokerage)}
              </div>

            </div>


            <div class="result-line">

              <div class="result-label">
              플랫폼 이용료
              </div>

              <div class="result-value">
              0원
              </div>

            </div>

          </div>


          <div class="result-total">

            <span>
            총 예상 비용<br>
            <small>(부가세 포함)</small>
            </span>

            <strong>
            ${money(sellerBrokerage)}
            </strong>

          </div>

        </div>


      </div>

      `;

    }
  );


  renderInputs();

}

</script>
