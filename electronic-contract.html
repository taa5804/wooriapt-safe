<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1165d7">

<title>전자계약 관리 | 우리아파트 안심거래</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}

body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Noto Sans KR",Arial,sans-serif;
}

button,input,textarea{font:inherit}

.wrap{
  width:100%;
  max-width:820px;
  margin:0 auto;
  padding:16px 14px 60px;
}

.header{
  background:#12394d;
  color:#fff;
  border-radius:16px;
  padding:20px 18px;
  margin-bottom:14px;
}

.header .brand{
  font-size:13px;
  opacity:.85;
  margin-bottom:5px;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:8px 0 0;
  font-size:14px;
  line-height:1.6;
}

.room-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.room-tab{
  min-height:48px;
  border-radius:12px;
  border:1px solid #cbd7df;
  background:#fff;
  color:#365062;
  font-weight:900;
  cursor:pointer;
}

.room-tab.active{
  background:#1165d7;
  color:#fff;
  border-color:#1165d7;
}

.card{
  background:#fff;
  border:1px solid #dfe7ec;
  border-radius:16px;
  padding:17px;
  margin-bottom:14px;
}

.card h2{
  margin:0 0 14px;
  font-size:18px;
}

.room-title{
  font-size:20px;
  font-weight:900;
}

.room-desc{
  font-size:13px;
  color:#6a7e8a;
  margin-top:5px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{margin-bottom:12px}

label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
}

input,textarea{
  width:100%;
  min-height:44px;
  border:1px solid #cbd7df;
  border-radius:10px;
  padding:10px 11px;
  outline:none;
  background:#fff;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.doc-row{
  display:flex;
  align-items:center;
  gap:8px;
  border-top:1px solid #edf1f4;
  padding:12px 0;
}

.doc-row:first-child{border-top:0}

.doc-name{
  flex:1;
  font-size:14px;
  font-weight:700;
}

.doc-state{
  font-size:12px;
  font-weight:900;
  color:#c23c3c;
}

.doc-state.ok{color:#14834a}

.upload-btn{
  background:#edf4ff;
  color:#1165d7;
  padding:8px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}

.hidden-file{display:none}

.notice{
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  background:#fff4e5;
  border:1px solid #ffd39b;
  color:#805000;
  font-size:13px;
  line-height:1.6;
}

.notice.ok{
  background:#edf9f2;
  border-color:#bce8cd;
  color:#146a38;
}

.btn{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
}

.btn-primary{
  background:#1165d7;
  color:#fff;
}

.btn-dark{
  background:#12394d;
  color:#fff;
}

.btn-light{
  background:#edf4ff;
  color:#1165d7;
}

.btn-gray,
.btn:disabled{
  background:#c7d0d5;
  color:#fff;
  cursor:not-allowed;
}

.help{
  margin-top:8px;
  font-size:12px;
  color:#71848f;
  line-height:1.6;
}

.hidden{display:none!important}

.contract-section,
.signature-section{
  display:none;
}

.contract-section.show,
.signature-section.show{
  display:block;
}

.contract-paper{
  background:#fff;
  border:2px solid #333;
  padding:18px 14px;
}

.contract-paper h3{
  text-align:center;
  margin:0 0 18px;
  font-size:22px;
}

.contract-table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.contract-table th,
.contract-table td{
  border:1px solid #555;
  padding:9px;
  text-align:left;
  vertical-align:top;
}

.contract-table th{
  width:30%;
  background:#f5f5f5;
}

.check-row{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin-top:10px;
  font-size:13px;
  line-height:1.5;
}

.check-row input{
  width:18px;
  height:18px;
  min-height:18px;
}

.sign-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.sign-box{
  background:#f8fafb;
  border:1px solid #dce5ea;
  border-radius:12px;
  padding:14px;
}

.sign-box strong{
  display:block;
  margin-bottom:7px;
}

.wait{
  color:#b36a00;
  font-weight:900;
}

.done{
  color:#14834a;
  font-weight:900;
}

.link-box{
  background:#f5f8fa;
  border:1px solid #dce5ea;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}

.sign-link{
  font-size:12px;
  line-height:1.5;
  color:#1165d7;
  word-break:break-all;
}

.status-complete{
  background:#edf9f2;
  border:1px solid #bce8cd;
  color:#146a38;
  border-radius:12px;
  padding:14px;
  margin-top:14px;
  font-weight:900;
  text-align:center;
}

@media(max-width:600px){
  .grid2,
  .sign-grid{
    grid-template-columns:1fr;
  }

  .header h1{
    font-size:21px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <div class="brand">
      우리아파트 안심거래 · 공인중개사 관리자
    </div>

    <h1>전자계약 관리</h1>

    <p>
      필수서류 확인 → 계약서 작성 →
      당사자 전자서명 → 계약완료
    </p>
  </div>


  <div class="room-tabs">

    <button class="room-tab active" data-type="sale">
      매매방
    </button>

    <button class="room-tab" data-type="jeonse">
      전세방
    </button>

    <button class="room-tab" data-type="monthly">
      월세방
    </button>

  </div>


  <div class="card">
    <div class="room-title" id="roomTitle">
      매매 전자계약방
    </div>

    <div class="room-desc" id="roomDesc"></div>
  </div>


  <div class="card">

    <h2>1. 거래 기본정보</h2>

    <div class="grid2">

      <div class="field">
        <label>거래번호</label>
        <input id="tradeId"
        placeholder="예: T202608270001">
      </div>

      <div class="field">
        <label>아파트명</label>
        <input id="aptName">
      </div>

      <div class="field">
        <label>주소</label>
        <input id="address">
      </div>

      <div class="field">
        <label>동·호수</label>
        <input id="unit">
      </div>

    </div>

  </div>


  <div class="card">

    <h2>2. 계약 당사자</h2>

    <div class="grid2">

      <div class="field">
        <label id="buyerNameLabel">매수인 성명</label>
        <input id="buyerName">
      </div>

      <div class="field">
        <label id="buyerPhoneLabel">매수인 휴대전화</label>
        <input id="buyerPhone" inputmode="numeric">
      </div>

      <div class="field">
        <label id="sellerNameLabel">매도인 성명</label>
        <input id="sellerName">
      </div>

      <div class="field">
        <label id="sellerPhoneLabel">매도인 휴대전화</label>
        <input id="sellerPhone" inputmode="numeric">
      </div>

    </div>

    <div class="help" id="partyHelp"></div>

  </div>


  <div class="card">

    <h2>3. 필수서류</h2>

    <div id="documentList"></div>

    <div class="notice" id="documentNotice">
      필수서류를 업로드해 주세요.
    </div>

  </div>


  <div class="card">

    <h2>4. 계약조건</h2>

    <div class="grid2">

      <div class="field">
        <label id="amountLabel">매매대금</label>
        <input id="totalAmount" inputmode="numeric">
      </div>

      <div class="field">
        <label>계약금</label>
        <input id="deposit" inputmode="numeric">
      </div>

      <div class="field" id="middleField">
        <label>중도금</label>
        <input id="middlePayment" inputmode="numeric">
      </div>

      <div class="field">
        <label id="balanceLabel">잔금</label>
        <input id="balance" inputmode="numeric">
      </div>

      <div class="field hidden" id="monthlyField">
        <label>월 차임</label>
        <input id="monthlyRent" inputmode="numeric">
      </div>

      <div class="field">
        <label>계약일</label>
        <input id="contractDate" type="date">
      </div>

      <div class="field">
        <label id="balanceDateLabel">잔금일</label>
        <input id="balanceDate" type="date">
      </div>

    </div>

    <div class="field">
      <label>특약사항</label>
      <textarea id="specialTerms"></textarea>
    </div>

  </div>


  <div class="card">

    <h2>5. 전자계약서 작성</h2>

    <button
      id="createContractBtn"
      class="btn btn-gray"
      disabled>

      필수서류 완료 후 전자계약서 작성

    </button>

  </div>


  <section
    class="contract-section"
    id="contractSection">

    <div class="card">

      <h2>6. 계약서 확인</h2>

      <div class="contract-paper">

        <h3 id="contractTitle"></h3>

        <table class="contract-table">

          <tr>
            <th>부동산</th>
            <td id="previewProperty"></td>
          </tr>

          <tr>
            <th id="previewBuyerTitle"></th>
            <td id="previewBuyer"></td>
          </tr>

          <tr>
            <th id="previewSellerTitle"></th>
            <td id="previewSeller"></td>
          </tr>

          <tr>
            <th id="previewAmountTitle"></th>
            <td id="previewAmount"></td>
          </tr>

          <tr>
            <th>계약금</th>
            <td id="previewDeposit"></td>
          </tr>

          <tr id="previewMiddleRow">
            <th>중도금</th>
            <td id="previewMiddle"></td>
          </tr>

          <tr>
            <th id="previewBalanceTitle"></th>
            <td id="previewBalance"></td>
          </tr>

          <tr id="previewMonthlyRow" class="hidden">
            <th>월 차임</th>
            <td id="previewMonthly"></td>
          </tr>

          <tr>
            <th>계약일</th>
            <td id="previewContractDate"></td>
          </tr>

          <tr>
            <th id="previewBalanceDateTitle"></th>
            <td id="previewBalanceDate"></td>
          </tr>

          <tr>
            <th>특약사항</th>
            <td id="previewTerms"></td>
          </tr>

        </table>

      </div>


      <div class="check-row">
        <input type="checkbox" id="check1">
        <label for="check1">
          부동산 정보를 확인했습니다.
        </label>
      </div>

      <div class="check-row">
        <input type="checkbox" id="check2">
        <label for="check2">
          계약금액과 지급일정을 확인했습니다.
        </label>
      </div>

      <div class="check-row">
        <input type="checkbox" id="check3">
        <label for="check3">
          특약사항을 확인했습니다.
        </label>
      </div>

      <br>

      <button
        id="completeContractBtn"
        class="btn btn-gray"
        disabled>

        계약서 작성완료

      </button>

    </div>

  </section>


  <section
    class="signature-section"
    id="signatureSection">

    <div class="card">

      <h2>7. 전자서명 요청</h2>

      <div class="sign-grid">

        <div class="sign-box">
          <strong id="buyerSignTitle"></strong>
          <span id="buyerSignState" class="wait">
            전자서명 대기
          </span>
        </div>

        <div class="sign-box">
          <strong id="sellerSignTitle"></strong>
          <span id="sellerSignState" class="wait">
            전자서명 대기
          </span>
        </div>

      </div>

      <br>

      <button
        id="sendSignBtn"
        class="btn btn-primary">

        양쪽에 전자서명 요청

      </button>


      <div id="generatedLinks" class="hidden">

        <div class="link-box">
          <strong id="buyerLinkTitle"></strong>
          <div class="sign-link" id="buyerLink"></div>
        </div>

        <div class="link-box">
          <strong id="sellerLinkTitle"></strong>
          <div class="sign-link" id="sellerLink"></div>
        </div>

      </div>


      <div
        id="contractComplete"
        class="status-complete hidden">

        ✅ 양쪽 전자서명이 모두 완료되었습니다.<br>
        전자계약 체결완료

      </div>

    </div>

  </section>

</div>


<script>

(function(){

"use strict";


/* =====================================================
   SUPABASE 설정

   다음 단계에서 실제 값을 넣습니다.

   절대로 service_role 키를 넣지 마세요.
===================================================== */

const SUPABASE_URL =
  https://dcysjuxyjqtvkihdsjvv.supabase.co/rest/v1/

const SUPABASE_ANON_KEY =
  sb_publishable_RZBX7u1v8MLBCfEJT0-eRg_jPcIulG2


let db = null;


if(
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_ANON_KEY.startsWith("여기에")
){

  db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

}


const $ = id =>
  document.getElementById(id);


let currentType = "sale";

let statusTimer = null;


const ROOM = {

  sale:{
    title:"매매 전자계약방",
    desc:"매수인과 매도인의 매매계약을 진행합니다.",
    buyer:"매수인",
    seller:"매도인",
    contractTitle:"부동산 매매계약서",
    amount:"매매대금",
    balance:"잔금",
    balanceDate:"잔금일",

    docs:[
      "등기부등본",
      "건축물대장",
      "매도인 신분확인 서류",
      "매수인 신분확인 서류",
      "중개대상물 확인·설명서"
    ]
  },

  jeonse:{
    title:"전세 전자계약방",
    desc:"임차인과 임대인의 전세계약을 진행합니다.",
    buyer:"임차인",
    seller:"임대인",
    contractTitle:"부동산 전세계약서",
    amount:"전세보증금",
    balance:"잔금",
    balanceDate:"잔금일",

    docs:[
      "등기부등본",
      "건축물대장",
      "임대인 신분확인 서류",
      "임차인 신분확인 서류",
      "중개대상물 확인·설명서"
    ]
  },

  monthly:{
    title:"월세 전자계약방",
    desc:"임차인과 임대인의 월세계약을 진행합니다.",
    buyer:"임차인",
    seller:"임대인",
    contractTitle:"부동산 월세계약서",
    amount:"보증금",
    balance:"잔여 보증금",
    balanceDate:"입주·잔금일",

    docs:[
      "등기부등본",
      "건축물대장",
      "임대인 신분확인 서류",
      "임차인 신분확인 서류",
      "중개대상물 확인·설명서"
    ]
  }

};


function numberValue(value){

  const n =
    String(value || "")
    .replace(/\D/g,"");

  return n
    ? Number(n)
    : null;

}


function money(value){

  const n =
    numberValue(value);

  if(n === null){
    return "-";
  }

  return n.toLocaleString("ko-KR") +
    "원";

}


function randomToken(){

  const arr =
    new Uint32Array(6);

  crypto.getRandomValues(arr);

  return Array
    .from(arr)
    .map(n => n.toString(36))
    .join("");

}


function renderRoom(){

  const d =
    ROOM[currentType];

  $("roomTitle").textContent =
    d.title;

  $("roomDesc").textContent =
    d.desc;

  $("buyerNameLabel").textContent =
    d.buyer + " 성명";

  $("buyerPhoneLabel").textContent =
    d.buyer + " 휴대전화";

  $("sellerNameLabel").textContent =
    d.seller + " 성명";

  $("sellerPhoneLabel").textContent =
    d.seller + " 휴대전화";

  $("partyHelp").textContent =
    d.buyer +
    " 정보는 기존 신청정보에서 자동으로 불러오고, " +
    d.seller +
    " 정보는 담당 공인중개사가 입력합니다.";

  $("amountLabel").textContent =
    d.amount;

  $("balanceLabel").textContent =
    d.balance;

  $("balanceDateLabel").textContent =
    d.balanceDate;

  $("buyerSignTitle").textContent =
    d.buyer;

  $("sellerSignTitle").textContent =
    d.seller;

  $("buyerLinkTitle").textContent =
    d.buyer + " 전자서명 링크";

  $("sellerLinkTitle").textContent =
    d.seller + " 전자서명 링크";

  if(currentType === "monthly"){

    $("middleField")
      .classList.add("hidden");

    $("monthlyField")
      .classList.remove("hidden");

  }else{

    $("middleField")
      .classList.remove("hidden");

    $("monthlyField")
      .classList.add("hidden");

  }

  $("contractSection")
    .classList.remove("show");

  $("signatureSection")
    .classList.remove("show");

  $("generatedLinks")
    .classList.add("hidden");

  $("contractComplete")
    .classList.add("hidden");

  resetStatus();

  renderDocuments();

}


function renderDocuments(){

  $("documentList").innerHTML =
    "";

  ROOM[currentType].docs
  .forEach(function(name,index){

    const row =
      document.createElement("div");

    row.className =
      "doc-row";

    row.innerHTML = `

      <div class="doc-name">
        ${name}
      </div>

      <div
        class="doc-state"
        id="state${index}">
        미첨부
      </div>

      <label
        class="upload-btn"
        for="file${index}">
        업로드
      </label>

      <input
        id="file${index}"
        class="hidden-file doc-file"
        type="file"
        data-name="${name}"
        accept=".pdf,.jpg,.jpeg,.png">

    `;

    $("documentList")
      .appendChild(row);

  });


  document
  .querySelectorAll(".doc-file")
  .forEach(function(file){

    file.addEventListener(
      "change",
      function(){

        const i =
          this.id.replace(
            "file",
            ""
          );

        const state =
          $("state"+i);

        if(this.files.length){

          state.textContent =
            "첨부완료";

          state.classList.add("ok");

        }else{

          state.textContent =
            "미첨부";

          state.classList.remove("ok");

        }

        checkDocuments();

      }
    );

  });

  checkDocuments();

}


function checkDocuments(){

  const files =
    Array.from(
      document.querySelectorAll(
        ".doc-file"
      )
    );


  const missing =
    files.filter(
      file => !file.files.length
    );


  if(!missing.length){

    $("documentNotice").className =
      "notice ok";

    $("documentNotice").textContent =
      "필수서류가 모두 첨부되었습니다. 전자계약서 작성이 가능합니다.";

    $("createContractBtn").disabled =
      false;

    $("createContractBtn").className =
      "btn btn-dark";

    $("createContractBtn").textContent =
      "전자계약서 작성";

  }else{

    $("documentNotice").className =
      "notice";

    $("documentNotice").textContent =
      "미첨부 서류: " +
      missing
      .map(f => f.dataset.name)
      .join(", ") +
      "을(를) 업로드해 주세요.";

    $("createContractBtn").disabled =
      true;

    $("createContractBtn").className =
      "btn btn-gray";

    $("createContractBtn").textContent =
      "필수서류 완료 후 전자계약서 작성";

  }

}


function makePreview(){

  const d =
    ROOM[currentType];


  $("contractTitle").textContent =
    d.contractTitle;


  $("previewProperty").textContent =
    [
      $("aptName").value,
      $("address").value,
      $("unit").value
    ]
    .filter(Boolean)
    .join(" / ") || "-";


  $("previewBuyerTitle").textContent =
    d.buyer;

  $("previewBuyer").textContent =
    ($("buyerName").value || "-") +
    " / " +
    ($("buyerPhone").value || "-");


  $("previewSellerTitle").textContent =
    d.seller;

  $("previewSeller").textContent =
    ($("sellerName").value || "-") +
    " / " +
    ($("sellerPhone").value || "-");


  $("previewAmountTitle").textContent =
    d.amount;

  $("previewAmount").textContent =
    money(
      $("totalAmount").value
    );


  $("previewDeposit").textContent =
    money(
      $("deposit").value
    );


  $("previewBalanceTitle").textContent =
    d.balance;

  $("previewBalance").textContent =
    money(
      $("balance").value
    );


  $("previewContractDate").textContent =
    $("contractDate").value || "-";


  $("previewBalanceDateTitle")
    .textContent =
    d.balanceDate;

  $("previewBalanceDate").textContent =
    $("balanceDate").value || "-";


  $("previewTerms").textContent =
    $("specialTerms").value ||
    "특약사항 없음";


  if(currentType === "monthly"){

    $("previewMiddleRow")
      .classList.add("hidden");

    $("previewMonthlyRow")
      .classList.remove("hidden");

    $("previewMonthly").textContent =
      money(
        $("monthlyRent").value
      );

  }else{

    $("previewMiddleRow")
      .classList.remove("hidden");

    $("previewMonthlyRow")
      .classList.add("hidden");

    $("previewMiddle").textContent =
      money(
        $("middlePayment").value
      );

  }

}


function checkConfirmation(){

  const ok =
    $("check1").checked &&
    $("check2").checked &&
    $("check3").checked;

  $("completeContractBtn").disabled =
    !ok;

  $("completeContractBtn").className =
    ok
    ? "btn btn-dark"
    : "btn btn-gray";

}


async function saveContract(){

  if(!db){

    alert(
      "Supabase 연결값이 아직 입력되지 않았습니다."
    );

    return false;
  }


  const tradeId =
    $("tradeId").value.trim();


  if(!tradeId){

    alert(
      "거래번호를 입력해 주세요."
    );

    $("tradeId").focus();

    return false;
  }


  const row = {

    trade_id:tradeId,

    trade_type:currentType,

    apartment_name:
      $("aptName").value.trim(),

    property_address:
      $("address").value.trim(),

    unit_info:
      $("unit").value.trim(),

    buyer_name:
      $("buyerName").value.trim(),

    buyer_phone:
      $("buyerPhone")
      .value
      .replace(/\D/g,""),

    seller_name:
      $("sellerName").value.trim(),

    seller_phone:
      $("sellerPhone")
      .value
      .replace(/\D/g,""),

    total_amount:
      numberValue(
        $("totalAmount").value
      ),

    deposit_amount:
      numberValue(
        $("deposit").value
      ),

    middle_amount:
      currentType === "monthly"
      ? null
      : numberValue(
          $("middlePayment").value
        ),

    balance_amount:
      numberValue(
        $("balance").value
      ),

    monthly_rent:
      currentType === "monthly"
      ? numberValue(
          $("monthlyRent").value
        )
      : null,

    contract_date:
      $("contractDate").value || null,

    balance_date:
      $("balanceDate").value || null,

    special_terms:
      $("specialTerms").value.trim(),

    contract_status:
      "READY",

    updated_at:
      new Date().toISOString()

  };


  const {error} =
    await db
    .from("electronic_contracts")
    .upsert(
      row,
      {
        onConflict:"trade_id"
      }
    );


  if(error){

    console.error(error);

    alert(
      "계약서 저장 중 오류가 발생했습니다.\n" +
      error.message
    );

    return false;
  }


  return true;

}


async function createSignatureRequests(){

  if(!db){

    alert(
      "Supabase 연결값이 아직 입력되지 않았습니다."
    );

    return;
  }


  const tradeId =
    $("tradeId").value.trim();


  const buyerPhone =
    $("buyerPhone")
    .value
    .replace(/\D/g,"");


  const sellerPhone =
    $("sellerPhone")
    .value
    .replace(/\D/g,"");


  if(buyerPhone.length < 10){

    alert(
      ROOM[currentType].buyer +
      " 휴대전화번호를 확인해 주세요."
    );

    return;
  }


  if(sellerPhone.length < 10){

    alert(
      ROOM[currentType].seller +
      " 휴대전화번호를 입력해 주세요."
    );

    return;
  }


  const buyerToken =
    randomToken();

  const sellerToken =
    randomToken();


  const rows = [

    {
      trade_id:tradeId,
      signer_role:"buyer",
      signer_name:
        $("buyerName").value.trim(),
      signer_phone:buyerPhone,
      sign_token:buyerToken,
      identity_verified:false,
      contract_confirmed:false,
      signed:false
    },

    {
      trade_id:tradeId,
      signer_role:"seller",
      signer_name:
        $("sellerName").value.trim(),
      signer_phone:sellerPhone,
      sign_token:sellerToken,
      identity_verified:false,
      contract_confirmed:false,
      signed:false
    }

  ];


  const {error} =
    await db
    .from("electronic_signatures")
    .upsert(
      rows,
      {
        onConflict:
          "trade_id,signer_role"
      }
    );


  if(error){

    console.error(error);

    alert(
      "전자서명 요청 생성 중 오류가 발생했습니다.\n" +
      error.message
    );

    return;
  }


  await db
  .from("electronic_contracts")
  .update({
    contract_status:"SIGNING",
    updated_at:
      new Date().toISOString()
  })
  .eq(
    "trade_id",
    tradeId
  );


  const base =
    location.origin +
    "/electronic-sign.html";


  const buyerUrl =
    base +
    "?trade=" +
    encodeURIComponent(tradeId) +
    "&type=" +
    encodeURIComponent(currentType) +
    "&role=buyer" +
    "&token=" +
    encodeURIComponent(buyerToken);


  const sellerUrl =
    base +
    "?trade=" +
    encodeURIComponent(tradeId) +
    "&type=" +
    encodeURIComponent(currentType) +
    "&role=seller" +
    "&token=" +
    encodeURIComponent(sellerToken);


  $("buyerLink").textContent =
    buyerUrl;

  $("sellerLink").textContent =
    sellerUrl;


  $("generatedLinks")
    .classList.remove("hidden");


  alert(
    "양쪽 전자서명 요청이 생성되었습니다.\n\n" +
    "다음 문자 연동 단계에서 이 링크가 자동 발송됩니다."
  );


  startStatusWatch();

}


function resetStatus(){

  $("buyerSignState").textContent =
    "전자서명 대기";

  $("buyerSignState").className =
    "wait";

  $("sellerSignState").textContent =
    "전자서명 대기";

  $("sellerSignState").className =
    "wait";

}


async function loadSignatureStatus(){

  if(!db){
    return;
  }


  const tradeId =
    $("tradeId").value.trim();


  if(!tradeId){
    return;
  }


  const {data,error} =
    await db
    .from("electronic_signatures")
    .select(
      "signer_role,signed,signed_at"
    )
    .eq(
      "trade_id",
      tradeId
    );


  if(error){

    console.error(error);

    return;
  }


  let buyerDone = false;
  let sellerDone = false;


  (data || []).forEach(function(row){

    if(
      row.signer_role === "buyer" &&
      row.signed
    ){

      buyerDone = true;

      $("buyerSignState").textContent =
        "✅ 전자서명 완료" +
        (
          row.signed_at
          ? " · " +
            new Date(
              row.signed_at
            ).toLocaleString("ko-KR")
          : ""
        );

      $("buyerSignState").className =
        "done";

    }


    if(
      row.signer_role === "seller" &&
      row.signed
    ){

      sellerDone = true;

      $("sellerSignState").textContent =
        "✅ 전자서명 완료" +
        (
          row.signed_at
          ? " · " +
            new Date(
              row.signed_at
            ).toLocaleString("ko-KR")
          : ""
        );

      $("sellerSignState").className =
        "done";

    }

  });


  if(
    buyerDone &&
    sellerDone
  ){

    $("contractComplete")
      .classList.remove("hidden");


    await db
    .from("electronic_contracts")
    .update({
      contract_status:"COMPLETED",
      updated_at:
        new Date().toISOString()
    })
    .eq(
      "trade_id",
      tradeId
    );

  }else{

    $("contractComplete")
      .classList.add("hidden");

  }

}


function startStatusWatch(){

  if(statusTimer){

    clearInterval(
      statusTimer
    );

  }


  loadSignatureStatus();


  statusTimer =
    setInterval(
      loadSignatureStatus,
      5000
    );

}


/* 방 선택 */

document
.querySelectorAll(".room-tab")
.forEach(function(tab){

  tab.addEventListener(
    "click",
    function(){

      document
      .querySelectorAll(".room-tab")
      .forEach(
        b => b.classList.remove("active")
      );

      this.classList.add("active");

      currentType =
        this.dataset.type;

      renderRoom();

    }
  );

});


/* 계약서 작성 */

$("createContractBtn")
.addEventListener(
  "click",
  function(){

    makePreview();

    $("contractSection")
      .classList.add("show");

    $("contractSection")
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  }
);


/* 체크박스 */

[
  "check1",
  "check2",
  "check3"
]
.forEach(function(id){

  $(id).addEventListener(
    "change",
    checkConfirmation
  );

});


/* 계약서 완료 */

$("completeContractBtn")
.addEventListener(
  "click",
  async function(){

    if(this.disabled){
      return;
    }


    const saved =
      await saveContract();


    if(!saved){
      return;
    }


    $("signatureSection")
      .classList.add("show");


    $("signatureSection")
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  }
);


/* 전자서명 요청 */

$("sendSignBtn")
.addEventListener(
  "click",
  createSignatureRequests
);


/* 거래번호 변경시 상태 확인 */

$("tradeId")
.addEventListener(
  "change",
  function(){

    resetStatus();

    startStatusWatch();

  }
);


renderRoom();

})();
</script>
