<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1165d7">

<title>공인중개사 로그인 | 우리아파트 안심거래</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f4f6f8;
  color:#172b3d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
}

#brokerLogin{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:24px 14px 55px;
}

.login-head{
  margin-bottom:18px;
}

.login-head .brand{
  margin-bottom:10px;
  font-size:15px;
  font-weight:800;
  color:#1165d7;
}

.login-head h1{
  margin:0 0 8px;
  font-size:27px;
  line-height:1.35;
  color:#13283c;
}

.login-head p{
  margin:0;
  font-size:14px;
  line-height:1.6;
  color:#667789;
}

.login-box{
  background:#fff;
  border:1px solid #dce4ec;
  border-radius:16px;
  padding:22px 18px;
  box-shadow:0 5px 18px rgba(27,52,78,.06);
}

.field-label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  font-weight:800;
}

.phone-wrap{
  display:flex;
  align-items:center;
  width:100%;
  border:1px solid #cfd9e3;
  border-radius:10px;
  overflow:hidden;
  background:#fff;
}

.phone-prefix{
  padding:0 12px;
  font-size:18px;
  font-weight:800;
  color:#172b3d;
  border-right:1px solid #dce4ec;
}

#phone{
  flex:1;
  min-width:0;
  height:48px;
  border:0;
  outline:0;
  padding:0 12px;
  font-size:18px;
  font-weight:700;
  color:#172b3d;
  background:#fff;
}

#phone::placeholder{
  color:#a0acb7;
  font-weight:500;
}

.help{
  margin:8px 0 0;
  font-size:12px;
  line-height:1.5;
  color:#758493;
}

.login-btn{
  width:100%;
  height:50px;
  margin-top:18px;
  border:0;
  border-radius:10px;
  background:#1165d7;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.login-btn:active{
  transform:translateY(1px);
}

.msg{
  min-height:22px;
  margin-top:12px;
  font-size:13px;
  font-weight:700;
}

.msg.error{
  color:#d93838;
}

.msg.ok{
  color:#168548;
}

.login-links{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin-top:18px;
  font-size:13px;
}

.login-links a{
  color:#1165d7;
  font-weight:700;
  text-decoration:none;
}

.notice{
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  background:#eef5ff;
  font-size:13px;
  line-height:1.65;
  color:#42566b;
}

.home-link{
  display:block;
  margin-top:20px;
  text-align:center;
  font-size:13px;
  font-weight:700;
  color:#647789;
  text-decoration:none;
}
</style>
</head>

<body>

<div id="brokerLogin">

  <div class="login-head">

    <div class="brand">
      우리아파트 안심거래
    </div>

    <h1>
      공인중개사 로그인
    </h1>

    <p>
      등록된 휴대전화번호로 로그인하세요.
    </p>

  </div>

  <div class="login-box">

    <form id="loginForm">

      <label
        class="field-label"
        for="phone">
        휴대전화번호
      </label>

      <div class="phone-wrap">

        <div class="phone-prefix">
          010-
        </div>

        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          maxlength="8"
          placeholder="12345678">

      </div>

      <p class="help">
        휴대전화번호 뒤 8자리를 입력해 주세요.
      </p>

      <button
        type="submit"
        class="login-btn">
        로그인
      </button>

      <div
        id="msg"
        class="msg">
      </div>

    </form>

    <div class="login-links">

      <a href="/broker-signup.html">
        공인중개사 회원가입
      </a>

      <a href="/broker-guide.html">
        공인중개사 이용안내
      </a>

    </div>

    <div class="notice">
      공인중개사 회원은 등록된 휴대전화번호를 이용해 로그인할 수 있습니다.
    </div>

  </div>

  <a
    class="home-link"
    href="/">
    ← 메인으로 돌아가기
  </a>

</div>

<script>
(function(){

"use strict";

const form =
document.getElementById("loginForm");

const phone =
document.getElementById("phone");

const msg =
document.getElementById("msg");

phone.addEventListener(
"input",
function(){

this.value =
this.value
.replace(/\D/g,"")
.slice(0,8);

}
);

form.addEventListener(
"submit",
function(e){

e.preventDefault();

msg.className = "msg";

if(phone.value.length !== 8){

msg.textContent =
"휴대전화번호 뒤 8자리를 정확히 입력해 주세요.";

msg.classList.add("error");

phone.focus();

return;

}

msg.textContent =
"로그인되었습니다.";

msg.classList.add("ok");

setTimeout(function(){

location.href =
"/broker-dashboard.html";

},300);

}
);

})();

</script>

</body>
</html>
