<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>에너젠마트 | 2026 최신형 모바일 장보기 샘플</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 0;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      min-height: 90vh;
      box-shadow: 0 15px 45px rgba(0,0,0,0.1);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      padding-bottom: 90px;
      border: 1px solid #e2e8f0;
    }

    /* 1. 상단 단순화: 잡다한 메뉴 제거, 홈과 장바구니만 배치 */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
    }
    .btn-home {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #334155;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      cursor: pointer;
    }
    .btn-home:hover {
      background: #e2e8f0;
    }
    .mart-brand {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #0f172a;
    }
    .mart-brand span {
      color: #2563eb;
    }
    .cart-box {
      position: relative;
      cursor: pointer;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border-radius: 50%;
      border: 1px solid #e2e8f0;
    }
    .cart-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      border: 2px solid #fff;
    }

    /* 2. 상단 마트 알림 띠배너 */
    .notice-bar {
      background: linear-gradient(90deg, #1e3a8a, #0284c7);
      color: #ffffff;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .notice-tag {
      background: rgba(255,255,255,0.22);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
    }

    /* 3. 모던 알약형(Pill) 카테고리 탭 */
    .tab-nav {
      display: flex;
      gap: 8px;
      padding: 14px 18px;
      overflow-x: auto;
      scrollbar-width: none;
      background: #fff;
      border-bottom: 1px solid #f8fafc;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-pill {
      white-space: nowrap;
      padding: 9px 16px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: #f1f5f9;
      color: #64748b;
      transition: all 0.2s;
    }
    .tab-pill.active {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }

    /* 4. 세련된 2열 상품 그리드 */
    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 16px 18px;
    }
    .product-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .product-card:hover {
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .img-wrap {
      width: 100%;
      height: 165px;
      position: relative;
      background: #f8fafc;
      overflow: hidden;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .discount-pill {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #ef4444;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
    }

    .info-wrap {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }
    .prod-name {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 4px;
    }
    .current-price {
      font-size: 18px;
      font-weight: 900;
      color: #0f172a;
    }
    .orig-price {
      font-size: 12px;
      color: #94a3b8;
      text-decoration: line-through;
    }

    /* 원터치 장바구니 버튼 */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
    }
    .stock-tag {
      font-size: 11px;
      font-weight: 600;
      color: #059669;
      background: #ecfdf5;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-add-cart {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
      transition: all 0.15s;
    }
    .btn-add-cart:active {
      transform: scale(0.9);
      background: #1d4ed8;
    }

    /* 하단 플로팅 구매/주문하기 바 */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      padding: 14px 18px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .total-info {
      font-size: 12px;
      color: #64748b;
    }
    .total-price {
      font-size: 19px;
      font-weight: 900;
      color: #0f172a;
    }
    .btn-order-main {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    /* 토스트 알림 */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
  <link rel="canonical" href="https://www.wooriapt.app/sample_mart">
  <meta name="robots" content="noindex,nofollow">
</head>
<body>

<div class="app-container">
  <!-- 1. 상단 헤더: 홈 / 마트이름 / 장바구니 -->
  <header class="header">
    <button class="btn-home" onclick="showToast('🏠 홈 화면으로 이동')">
      <span>🏠</span> 홈
    </button>
    <div class="mart-brand">
      에너젠<span>마트</span>
    </div>
    <div class="cart-box" onclick="showToast('🛒 장바구니 2개 품목 확인')">
      <span style="font-size: 18px;">🛒</span>
      <span class="cart-badge" id="cartCount">2</span>
    </div>
  </header>

  <!-- 2. 신선특가 배너 -->
  <div class="notice-bar">
    <span>⚡ 오늘 들어온 산지직송 당일특가</span>
    <span class="notice-tag">오늘 마감</span>
  </div>

  <!-- 3. 모던 알약형 카테고리 탭 -->
  <div class="tab-nav">
    <button class="tab-pill active" onclick="selectTab(this)">🔥 오늘특가</button>
    <button class="tab-pill" onclick="selectTab(this)">🎉 전단행사</button>
    <button class="tab-pill" onclick="selectTab(this)">👥 공동구매</button>
    <button class="tab-pill" onclick="selectTab(this)">🥬 신선채소</button>
    <button class="tab-pill" onclick="selectTab(this)">🥩 정육코너</button>
  </div>

  <!-- 4. 상품 그리드 (2026 최신형 모바일 커머스 스타일) -->
  <div class="product-grid">

    <!-- 상품 1: 긴 애호박 -->
    <div class="product-card">
      <div class="img-wrap">
        <span class="discount-pill">17% OFF</span>
        <img src="https://images.unsplash.com/photo-1597362925123-77861d3fbac7?w=500" alt="긴 호박">
      </div>
      <div class="info-wrap">
        <div>
          <div class="prod-name">국내산 긴 애호박 1개 (특상급)</div>
          <div class="price-row">
            <span class="current-price">1,000원</span>
            <span class="orig-price">1,200원</span>
          </div>
        </div>
        <div class="card-footer">
          <span class="stock-tag">당일입고</span>
          <button class="btn-add-cart" onclick="addToCart('애호박 1개')" title="장바구니 담기">🛒+</button>
        </div>
      </div>
    </div>

    <!-- 상품 2: 꿀고구마 -->
    <div class="product-card">
      <div class="img-wrap">
        <img src="https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=500" alt="고구마">
      </div>
      <div class="info-wrap">
        <div>
          <div class="prod-name">달콤한 해남 꿀고구마 (100g)</div>
          <div class="price-row">
            <span class="current-price">1,980원</span>
          </div>
        </div>
        <div class="card-footer">
          <span class="stock-tag">인기상품</span>
          <button class="btn-add-cart" onclick="addToCart('해남 꿀고구마')" title="장바구니 담기">🛒+</button>
        </div>
      </div>
    </div>

    <!-- 상품 3: 파프리카 모듬 -->
    <div class="product-card">
      <div class="img-wrap">
        <span class="discount-pill">20% OFF</span>
        <img src="https://images.unsplash.com/photo-1563565375-f3fdfdbefa83?w=500" alt="파프리카">
      </div>
      <div class="info-wrap">
        <div>
          <div class="prod-name">알록달록 파프리카 3입 1봉</div>
          <div class="price-row">
            <span class="current-price">2,480원</span>
            <span class="orig-price">3,100원</span>
          </div>
        </div>
        <div class="card-footer">
          <span class="stock-tag">한정수량</span>
          <button class="btn-add-cart" onclick="addToCart('파프리카 1봉')" title="장바구니 담기">🛒+</button>
        </div>
      </div>
    </div>

    <!-- 상품 4: 흙대파 -->
    <div class="product-card">
      <div class="img-wrap">
        <img src="https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=500" alt="대파">
      </div>
      <div class="info-wrap">
        <div>
          <div class="prod-name">신선한 산지직송 흙대파 1단</div>
          <div class="price-row">
            <span class="current-price">1,500원</span>
          </div>
        </div>
        <div class="card-footer">
          <span class="stock-tag">새벽수확</span>
          <button class="btn-add-cart" onclick="addToCart('흙대파 1단')" title="장바구니 담기">🛒+</button>
        </div>
      </div>
    </div>

  </div>

  <!-- 하단 주문하기 플로팅 바 -->
  <div class="bottom-bar">
    <div>
      <div class="total-info">현재 담은 금액 (2개)</div>
      <div class="total-price" id="totalPrice">2,980원</div>
    </div>
    <button class="btn-order-main" onclick="showToast('🛍️ 주문서 결제 페이지로 이동')">
      주문하기 ➔
    </button>
  </div>
</div>

<!-- 안내 토스트 메시지 -->
<div class="toast" id="toast">
  <span>🛒</span> <span id="toastMsg">장바구니에 담겼습니다!</span>
</div>

<script>
  let cart = 2;
  let total = 2980;
  function addToCart(name) {
    cart++;
    total += 1000;
    document.getElementById('cartCount').innerText = cart;
    document.getElementById('totalPrice').innerText = total.toLocaleString() + '원';
    showToast(name + ' 담기 완료!');
  }

  function selectTab(el) {
    document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').innerText = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      t.classList.remove('show');
    }, 2000);
  }
</script>

</body>
</html>
